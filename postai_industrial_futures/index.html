","S03"],"first":"分布式基础电力 + 水与卫生 + 粮食减损 + 流动维修服务。","chain":["保护生活底线和既有资产","低固定成本的维修与服务","共享物流和区域采购","形成可持续收费与外汇来源"],"ai":"离线可用的维修知识、教育辅助、简化台账与服务调度；保留纸面流程和供应商退出后的接管办法。","bottleneck":"外汇、财政与服务运维，跨境运输成本，脆弱性与小市场规模。","imports":"区域共享计量、医院专业设备、关键备件和数字基础设施；以保底服务与区域互助补足本地规模不足。","gate":"每项设备必须同时具备维护人、至少一年的运行预算、关键备件和替代流程；条件不满足则暂停扩张。","counter":"无赠款或长期低成本资金时，强行以商业回报覆盖基础公共服务，会使最贫困地区被模型系统性排除。"},"SA":{"name":"南亚制造—农业型","short":"南亚","ag":50,"other":190,"g":0.05,"fx":70,"fg":0.05,"mine":0,"mi0":0.4,"mi1":0.18,"prod":0.45,"ret":0.08,"fxret":0.04,"expected":0.659956398008777,"color":"#8eadee"},"SEA":{"name":"东南亚加工—出口型","short":"东南亚","ag":100,"other":350,"g":0.045,"fx":180,"fg":0.045,"mine":0,"mi0":0.4,"mi1":0.16,"prod":0.5,"ret":0.08,"fxret":0.045,"expected":1,"color":"#b6ce7d"}},"comparators":[{"id":"SOUTH","name":"南部既有工业网络","short":"南部","lon":25,"lat":-29,"color":"#8eadee","thesis":"工业化不总是从零开始，也包括修复既有能力。","entry":"作为比较情景，优先讨论电网与物流可靠性、既有工厂升级、供应商再组织和技能传承，不把南非等既有工业体系写成“等待第一座工厂”的空白。","first":"修复既有机电、冶金与工程服务网络；连接区域订单。","bottleneck":"基础设施可靠性、成本竞争力、就业吸纳与转型分配。","scope":"本次未建立独立数值参数，不能借用铜矿型结果充当南非预测。","refs":["S06","S14","S16"]},{"id":"NORTH","name":"北非产业与港口网络","short":"北非","lon":-6,"lat":31,"color":"#dbcc9b","thesis":"把更完整的产业网络作为比较，不偷偷扩大人口分母。","entry":"北非被纳入非洲路径比较，但不计入本项目40.59亿人口总览。可研究既有港口、制造配套、区域贸易与新能源如何结合，而不是把非洲设成同一起跑线。","first":"以现有工业节点连接机电、化工、农业与跨境产业配套。","bottleneck":"水资源、市场准入、产业配套、规则变化与收益落地。","scope":"定性比较场景；没有为摩洛哥、埃及等国家伪造统一资本和收益参数。","refs":["S15","S16"]}],"questions":[{"id":"Q1","title":"更便宜的智能，何时成为更便宜的合格产品？","kind":"机制假说","claim":"AI先压缩知识搜寻与设计成本，随后通过可验证的工程流程减少停机、返工和错误采购。","counter":"模型会生成方案，却未必会发现材料批次、传感器漂移或现场违规；设计降本可能被验证成本抵消。","test":"记录同类工单的人工时、一次修复率、停机时长和安全异常；采用分阶段上线与对照线。","data":"设备日志、质量记录、AI介入前后工单、事故与返工台账。","refs":["S11","P02"]},{"id":"Q2","title":"资源收入是否真正进入扩大再生产？","kind":"待验证","claim":"矿业净收益可以为早期进口提供外汇，但只有留存与可支配部分可以进入建设预算。","counter":"海外分红、进口耗材、遗留债务与复垦义务可能消耗大部分出口收入。","test":"逐合同重建矿山现金桥；区分政府税收、当地企业收益和实际可拨付发展资金。","data":"产量、品位、销售合同、成本、债务计划、税费与分红。","refs":["S07","P03"]},{"id":"Q3" function agriculture(p={}){

function energy(p={}){

 }

<details class="research-only"><summary>模型范围、公式与两份旧模型的区别</summary><div class="detail-content"><div class="method-grid"><div><h3>资金闸门</h3><div class="formula">当年可用资金 = 期初结余 + 可动员净现金<br>+ 赠款 + 贷款提款 − 实付本息<br>建设额 ≤ 当年可用资金</div></div><div><h3>外汇闸门</h3><div class="formula">当年外汇额度 = 期初额度 + 净外汇贡献<br>+ 外部融资 − 实付本息<br>建设额 × 进口率 ≤ 外汇额度</div></div></div><p>建设另受年度施工能力、累计计划和目标余量限制。已投入经营资产次年起贡献净现金；假定经营净现金率已包含运维、更新准备和外方分红；公共资产另扣1%维护。该假定尚未经区域调查校准。</p><div class="table-wrap"><table class="text-table"><thead><tr><th>继承的模型</th><th>每100万人建设边界</th><th>不应混淆</th></tr></thead><tbody><tr><td>P02 十年增量建设</td><td>约74.23亿美元；新增2TWh/年用电、500万m²住房与配套</td><td>不是从零建设一座完整工业社会；原表只识别融资前外汇缺口</td></tr><tr><td>P03 25年物理篮子</td><td>约243.71亿美元；18百万m²住房、约2.954GWp光伏等</td><td>本页复现对象；资金与外汇双约束，六类原型不是六国预测</td></tr></tbody></table></div><p>本页严格复现原表六个基准终值；经营收益按已投资本计提，建造降本时未独立重估同等物理产能的收入，这是一项需要改进的简化。本次增加公共支出、临时冲击和进度本地化作为可区分的扩展。没有货币政策、价格均衡、人口增长、跨区贸易清算或国家整体财政；建造成本下降不会自动提高合格率或降低材料吨数。</p><p>${refs(['P02','P03','M01'])}</p></div></details>

const colors={gold:'#edba7a',green:'#79d9bb',red:'#ed9096',blue:'#8eadee',violet:'#d9a4ed',muted:'#71869b'};
function bars(items,max=1){return items.map(a=>`<div class="comparison-row"><span>${esc(a.label)}</span><div class="bar-track"><i style="width:${Math.max(0,Math.min(100,a.value/max*100))}%;background:${a.color||colors.gold}"></i></div><b style="color:${a.color||colors.gold}">${a.display??pct(a.value)}</b></div>`).join('');}
function linesChart(series,opts={}){const W=760,H=300,L=58,R=20,T=25,B=39,N=series[0]?.values.length||2;const vals=series.flatMap(s=>s.values);const min=opts.min??0,max=opts.max??Math.max(...vals,1)*1.12;const x=i=>L+i/(N-1)*(W-L-R),y=v=>H-B-(v-min)/(max-min)*(H-T-B);let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||'情景曲线')}"><title>${esc(opts.title||'情景曲线')}</title>`;for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v);out+=`<line class="axis" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#2a3a48" stroke-dasharray="3 5"/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="#a9b8c5" font-size="11">${opts.percent?fmt(v,0)+'%':fmt(v,opts.decimals||0)}</text>`;}const indexes=opts.xticks||[0,Math.round((N-1)/4),Math.round((N-1)/2),Math.round(3*(N-1)/4),N-1];indexes.forEach(i=>{out+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#9eafbe" font-size="11">${esc(opts.xlabels?opts.xlabels[i]:i+1)}</text>`;});series.forEach(s=>{const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(2)+','+y(v).toFixed(2)).join('');out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.4}" ${s.dashed?'stroke-dasharray="5 6"':''}/>`;if(N<40)s.values.forEach((v,i)=>{out+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"><title>${esc(s.label)} · ${opts.xlabels?.[i]||i+1}: ${fmt(v,2)}${opts.percent?'%':''}</title></circle>`;});});if(opts.highlight!=null){const xx=x(opts.highlight);out+=`<line x1="${xx}" y1="${T}" x2="${xx}" y2="${H-B}" stroke="#f1f1eb" stroke-width="1" opacity=".5"/>`;}out+='</svg><div class="legend">'+series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')+'</div>';return out;}
function renderOverview(){const entries=Object.entries(D.regions);$('overview-compare').innerHTML=bars(entries.map(([k,r])=>({label:r.name,value:r.expected,color:r.color||colors.blue})))+`<p class="footnote">相同243.71亿美元物理目标、不同现金/外汇起点，25年完成率差异来自输入假设；不是区域能力排名。${refs(['P03'])}</p>`;}
function renderCost(){const a=M.costModel(state.cost);$('cost-result').innerHTML=`<div class="big-num">${pct(a.cut)}<small>合计降本</small></div><p>不是知识成本降幅，而是这组成本权重与兑现假设下的总成本变化。</p><div class="cost-bars">${a.parts.map((p,i)=>`<div style="width:${p.residual*100}%;background:${[colors.gold,colors.green,colors.blue,colors.muted][i]}" title="${p.name}：基期${pct(p.weight)}，残余贡献${pct(p.residual)}">${pct(p.residual,1)}</div>`).join('')}</div><div class="legend">${a.parts.map((p,i)=>`<span><i style="background:${[colors.gold,colors.green,colors.blue,colors.muted][i]}"></i>${p.name}</span>`).join('')}</div><div class="mini-stat"><span>总成本指数（原成本=100）</span><b>${fmt(a.index*100,1)}</b></div>`;}
function renderCompute(){const v=state.compute,a=M.aiCompute({population:+v.scope*1e9,tokens:10**v.tokensLog,burden:+v.burden,util:v.util/100,adoption:v.adoption/100,price:v.price/100});$('compute-metrics').innerHTML=metric('云端加速器存量',fmt(a.cards/1e4,2),'万张','连续当量；采购需取整')+metric('设施平均功率',fmt(a.gw,2),'GW','分摊平均IT功率 × PUE')+metric('云端全年电量',fmt(a.twh,2),'TWh','token服务，不是全社会AI')+metric('光伏整站用地当量',fmt(a.area,1),'km²','仅年电量匹配；不含可靠性定容');$('compute-comparison').innerHTML=`<div class="mini-stat"><span>按每人6MWh/年的全社会用电情景</span><b>${fmt(a.societyTWh/1000,2)} PWh</b></div><div class="mini-stat"><span>上述token服务 / 该全社会用电情景</span><b>${pct(a.share,3)}</b></div><div class="mini-stat"><span>采购价格指数（基期100）</span><b>${fmt(a.priceIndex,0)}</b></div><p class="footnote">两者为不同范围的假设计算；全社会总量已含计算时不能再重复相加。提高服务负担100倍会同比放大本模型电力；降低采购价则不会。</p>`;}
function getCase(id){return D.regions[id]||D.comparators.find(c=>c.id===id);}
function renderAfrica(){const r=getCase(state.case),W=560,H=570,project=([lon,lat])=>[(lon+21)/77*W,(39-lat)/78*H];const groups={CU:['Zambia','Dem. Rep. Congo'],WA:['Guinea','Ghana','Côte d\'Ivoire'],EA:['Kenya','Tanzania','Ethiopia'],LAND:['Niger','Chad','Mali'],SOUTH:['South Africa','Botswana','Namibia'],NORTH:['Morocco','Algeria','Tunisia','Egypt']};const nodes=[...['CU','WA','EA','LAND'].map(id=>({id,...D.regions[id]})),...D.comparators];let svg=`<svg viewBox="0 0 ${W} ${H}" class="africa-map" role="img" aria-label="非洲区域工业路径示意，可点击研究节点"><title>非洲路径地图：定性研究入口，不是统计分区或评级</title>`;for(let lat=-30;lat<=30;lat+=15){const yy=project([0,lat])[1];svg+=`<line x1="12" y1="${yy}" x2="548" y2="${yy}" class="graticule"/><text x="10" y="${yy-5}" fill="#536b80" font-size="10">${lat}°</text>`;}D.geography.filter(f=>f.continent==='Africa').forEach(f=>{const chosen=(groups[state.case]||[]).includes(f.name);svg+=`<path class="land ${chosen?'selected':''}" d="${pathGeo(f.geometry,project)}" ${chosen?`style="fill:${r.color}35;stroke:${r.color}"`:''}><title>${esc(f.name)} · 地理定位示意</title></path>`;});if(state.maplayer==='constraint'){const [x,y]=project([26,-11]);[[38,-3],[-10,10],[25,-29]].forEach(xy=>{const [xx,yy]=project(xy);svg+=`<path d="M${x},${y}Q${(x+xx)/2-35},${(y+yy)/2-35} ${xx},${yy}" fill="none" stroke="#79d9bb" opacity=".65" stroke-dasharray="5 6"/>`;});}nodes.forEach(n=>{const[x,y]=project([n.lon,n.lat]);const label=state.maplayer==='capacity'?({CU:'维修 / 计量',WA:'农食 / 建材',EA:'冷链 / 机电',LAND:'基本服务',SOUTH:'既有能力更新',NORTH:'港口 / 配套'}[n.id]):n.short;const w=label.length*12+20;const dx=n.id==='EA'?12:n.id==='LAND'?12:-w/2;const dy=n.id==='LAND'?-28:n.id==='EA'?8:22;svg+=`<g class="place ${state.case===n.id?'active':''}" data-case="${n.id}" role="button" tabindex="0" aria-label="选择${esc(n.name)}"><circle cx="${x}" cy="${y}" r="${state.case===n.id?13:8}" fill="${n.color}" opacity=".2"/><circle cx="${x}" cy="${y}" r="4.5" fill="${n.color}"/><rect x="${x+dx}" y="${y+dy-16}" width="${w}" height="26" rx="5" fill="#101e2b" stroke="${state.case===n.id?n.color:'#394c5a'}"/><text x="${x+dx+w/2}" y="${y+dy+1}" fill="${n.color}" text-anchor="middle" font-size="12">${label}</text></g>`;});svg+='</svg>';$('africa-map').innerHTML=svg;$('map-caption').textContent={resource:'着色仅标示所选研究案例涉及的若干国家，不表示独占产业带或完整区域边界。',capacity:'节点显示建议优先调查的能力，不表示这些地区已达到相同水平。',constraint:'虚线表示研究中的互供逻辑，不是已经建成的铁路、电网或贸易流。'}[state.maplayer];$('map-buttons').innerHTML=nodes.map(n=>`<button class="pill ${state.case===n.id?'active':''}" data-case="${n.id}">${n.short}</button>`).join('');document.querySelectorAll('[data-maplayer]').forEach(el=>el.classList.toggle('active',el.dataset.maplayer===state.maplayer));
if(r.chain){$('case-detail').innerHTML=`<div class="card" style="border-top:3px solid ${r.color}"><div class="tags"><span class="tag infer">路径假说</span><span class="tag">${esc(r.subtitle)}</span></div><h2 style="margin-top:17px">${esc(r.thesis)}</h2><p>${esc(r.entry)}</p><div class="note info">${esc(r.facts)} ${refs(r.refs)}</div><div class="case-section"><h4>第一组能力包</h4><p>${esc(r.first)}</p></div><div class="chain-list">${r.chain.map((c,i)=>`<div><span>0${i+1}</span>${esc(c)}</div>`).join('')}</div><div class="case-section"><h4>AI介入点</h4><p>${esc(r.ai)}</p></div><div class="case-section"><h4>最先碰到的约束</h4><p>${esc(r.bottleneck)}</p></div><details><summary>关键进口、验收与反方</summary><div class="detail-content"><h4>可以保留的外部依赖</h4><p>${esc(r.imports)}</p><h4>可检验关卡</h4><p>${esc(r.gate)}</p><h4>反方</h4><p>${esc(r.counter)}</p></div></details><button class="btn primary" style="margin-top:17px" data-run-case="${state.case}">带入资金实验室 ↗</button><p class="footnote" style="margin-top:10px">数值使用${esc(r.name)}假设，不是${esc(r.subtitle)}的财政或国家预测。</p></div>`;}else{$('case-detail').innerHTML=`<div class="card" style="border-top:3px solid ${r.color}"><span class="tag infer">定性对照 · 不进入数值模型</span><h2 style="margin-top:17px">${esc(r.thesis)}</h2><p>${esc(r.entry)}</p><div class="case-section"><h4>可优先调查的能力</h4><p>${esc(r.first)}</p></div><div class="case-section"><h4>必须检验的约束</h4><p>${esc(r.bottleneck)}</p></div><div class="note warning">${esc(r.scope)}</div>${refs(r.refs)}</div>`;}}
function renderStage(){const s=stages[state.stage],checks=state.checks[state.stage]||[false,false,false];document.querySelectorAll('[data-stage]').forEach(el=>el.classList.toggle('active',+el.dataset.stage===state.stage));$('stage-detail').innerHTML=`<div class="grid g2"><div class="card accent"><span class="kicker">能力层级 0${state.stage}</span><h2>${s.goal}</h2><p>${s.text}</p><div class="case-section"><h4>实物与组织资产</h4><p>${s.assets}</p></div><div class="case-section"><h4>AI的可能角色</h4><p>${s.ai}</p></div><span class="tag">${s.time}</span></div><div class="card"><h3>把每项判断变成可验收记录</h3>${s.gates.map((g,i)=>`<label class="gate-row"><input type="checkbox" data-gate="${i}" ${checks[i]?'checked':''}><span>${g}</span></label>`).join('')}<div class="gate-status">已标记 ${checks.filter(Boolean).length} / 3 项。此勾选仅是个人研究清单，不构成现场认证。</div><div class="note warning"><b>停止 / 边界：</b>${s.stop}</div><p class="footnote">可在研究台记录验收证据与反例。${refs(['P02','S13'])}</p></div></div>`;}
function renderFinance(){const p=state.finance,r=D.regions[p.region];simulation=M.simulate(D.regions,p);const a=simulation,base=M.simulate(D.regions,{region:p.region}),last=a.last;$('finance-metrics').innerHTML=metric('25年物理目标完成率',pct(last.completion),'','与本原型旧基准相差 '+fmt((last.completion-base.last.completion)*100,1)+' 个百分点')+metric('累计实际建设',fmt(last.built/1000,2),'十亿美元','目标造价 '+fmt(a.target/1000,2)+' 十亿美元')+metric('累计建设进口',fmt(a.totalImports/1000,2),'十亿美元','是建设支出子项，不再加到总额')+metric('期末债务',fmt(last.debt,2),'M$','未付利息资本化；无自动续贷',last.debt>.1?'red':'');
const series=[{label:'当前条件',color:colors.gold,values:a.rows.map(x=>x.completion*100),width:3},{label:'同原型旧基准',color:colors.blue,values:base.rows.map(x=>x.completion*100),dashed:true},{label:'原年度建设计划',color:colors.muted,values:a.rows.map(x=>x.planProgress*100),dashed:true}];state.pins.forEach((pin,i)=>{const s=M.simulate(D.regions,pin.params);series.push({label:pin.name,color:[colors.green,colors.violet,colors.red][i],values:s.rows.map(x=>x.completion*100),dashed:true});});$('finance-chart').innerHTML=linesChart(series,{max:100,percent:true,xlabels:a.rows.map(x=>x.year),title:'2027—2051物理目标完成率情景',highlight:state.year-1});
const counts={};a.rows.forEach(x=>counts[x.binding]=(counts[x.binding]||0)+1);const main=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];$('finance-diagnosis').innerHTML=`<div class="note ${a.unpaidSum>0||a.maintenanceGapSum>0||a.fxOperatingGapSum>0?'warning':'info'}"><b>当前主导约束：${main[0]}</b>（${main[1]}个年度）。${a.unpaidSum>.00001?`累计未足额支付本息发生额 ${fmt(a.unpaidSum,2)} M$；这不是新增债务总额，可能包含跨年重复到期本金。`:'本组参数内未出现本息支付不足。'} ${a.maintenanceGapSum>0?`另有基本支出资金缺口累计 ${fmt(a.maintenanceGapSum,1)} M$；曲线不能证明服务得到保障。`:''} ${a.fxOperatingGapSum>0?`另有经常性支出的外汇额度缺口累计 ${fmt(a.fxOperatingGapSum,1)} M$，不足部分没有被自动融资。`:''}</div><p class="footnote">原型起点：农业再投资${r.ag}M$/年，其他资金${r.other}M$/年，矿业分配${r.mine}M$/年；基础外汇${r.fx}M$/年另作支付限制。资金结余${fmt(last.cash,1)}M$、外汇额度结余${fmt(last.fx,1)}M$，两者不能相加。${refs(['P03'])}</p>`;
$('finance-table').querySelector('tbody').innerHTML=a.rows.map(x=>`<tr data-year="${x.y}" ${x.y===state.year?'class="selected-row"':''}><td><button class="ref" data-year="${x.y}">${x.year}</button></td><td>${fmt(x.ownCash,1)}</td><td>${fmt(x.ownFx,1)}</td><td>${fmt(x.payment,1)}</td><td>${fmt(x.investment,1)}</td><td>${fmt(x.imports,1)}</td><td>${fmt(x.debt,1)}</td><td>${pct(x.completion)}</td><td class="table-text">${esc(x.binding)}</td></tr>`).join('');renderFinanceYear();renderPins();}
function renderFinanceYear(){if(!simulation)return;const r=simulation.rows[state.year-1];$('year-output').textContent=r.year;$('finance-year').value=state.year;const cashRoom=Math.max(0,r.startCash+r.ownCash+r.grant+r.draw-r.payment),fxRoom=Math.max(0,r.startFx+r.ownFx+r.grant+r.draw-r.payment);$('finance-year-detail').innerHTML=`<div class="method-grid" style="margin-top:14px"><div><span class="tag">资金闸门 · M$</span><div class="mini-stat"><span>期初现金 / 当年自身净现金</span><b>${fmt(r.startCash,1)} / ${fmt(r.ownCash,1)}</b></div><div class="mini-stat"><span>赠款 + 新贷款</span><b>${fmt(r.grant+r.draw,1)}</b></div><div class="mini-stat"><span>偿债后可建设现金</span><b>${fmt(cashRoom,1)}</b></div></div><div><span class="tag">外汇闸门 · M$</span><div class="mini-stat"><span>期初额度 / 当年自身额度</span><b>${fmt(r.startFx,1)} / ${fmt(r.ownFx,1)}</b></div><div class="mini-stat"><span>建设进口含量</span><b>${pct(r.imp)}</b></div><div class="mini-stat"><span>外汇可支撑的建设上限</span><b>${fmt(fxRoom/r.imp,1)}</b></div></div></div><div class="note">${r.year}年实际建设 <b>${fmt(r.investment,1)} M$</b>，其中进口 <b>${fmt(r.imports,1)} M$</b>。主要限制：<b>${r.binding}</b>。当年应付本息${fmt(r.due,2)} M$，实付${fmt(r.payment,2)} M$。</div><details><summary>同一物理篮子的累计工程量映射</summary><div class="detail-content"><div class="grid g3">${metric('光伏装机',fmt(r.solarMW/1000,2),'GWp','年度粗配，不代表可用电力')}${metric('住宅建设 / 更新',fmt(r.housingM2/1e6,2),'百万m²','不是新增人口或住房户数')}${metric('累计水泥 / 钢材',fmt(r.cementT/1e6,2)+' / '+fmt(r.steelT/1e6,2),'Mt','需求映射，不是当地已具备产能')}</div><p class="footnote">按同一篮子比例映射，未显式模拟各行业投产顺序、当地物料供应与跨境物流。成本降幅只改变价格，不改变满额物理目标。</p></div></details>`;document.querySelectorAll('#finance-table tbody tr').forEach(el=>el.classList.toggle('selected-row',+el.dataset.year===state.year));}

function renderMineral(){const a=M.mineral(state.mineral);const nums=[['总销售',a.revenue,colors.gold],['减：运营',a.operating,colors.muted],['减：维持/复垦',a.reserve,colors.muted],['自由现金流',a.fcf,colors.blue],['当地留存',a.local,colors.green],['发展计划',a.plan,colors.gold]];const max=Math.max(a.revenue,1);$('mineral-result').innerHTML=`<div class="row between"><h3>现金漏斗 · M$/年</h3><span class="tag model">条件模型</span></div><div class="waterfall">${nums.map(([l,n,c])=>`<div class="wf-col"><div class="wf-value">${fmt(n,1)}</div><div class="wf-bar" style="height:${Math.max(0,n)/max*140+2}px;background:${c}"></div><div class="wf-label">${l}</div></div>`).join('')}</div><div class="grid g2 keep2">${metric('当前计划可用',fmt(a.plan,2),'M$/年','不是出口总额')}${metric('仅售价下跌20%后',fmt(a.stressedPlan,2),'M$/年',a.change==null?'基准分配为零，百分比无定义':'相对变化 '+pct(a.change))}</div><div class="note ${a.fcf<0?'warning':'info'}">${a.fcf<0?`原项目自由现金流为负（${fmt(a.fcf,1)}M$）。分配归零，不把亏损隐藏成可投资本钱。`:'先扣运营、维持与复垦，再看当地留存和发展分配。其他成本固定时，售价波动会被利润结构放大。'}</div>`;}

function renderEnergy(){const a=M.energy(state.energy);$('energy-metrics').innerHTML=metric('光伏年度规模',fmt(a.pvMW/1000,2),'GWp','20%下游损耗/储能/弃光预留')+metric('储能名义容量',fmt(a.batteryMWh/1000,2),'GWh','充放功率 '+fmt(a.powerMW,0)+' MW')+metric('光伏 / 储能初装',fmt(a.pvCapexM,0)+' / '+fmt(a.storageCapexM,0),'M$','不含完整电网、备份及更新')+metric('光伏单独发电成本',fmt(a.lcoe*100,2),'美分/kWh','不含储能、电网与可靠性成本');$('energy-chart').innerHTML=linesChart([{label:'负荷 MW',color:colors.gold,values:a.rows.map(x=>x.load),width:2.5},{label:'实际服务负荷 MW',color:colors.green,values:a.rows.map(x=>x.served),width:2},{label:'光伏发电 MW',color:colors.blue,values:a.rows.map(x=>x.solar),dashed:true}],{title:'合成一周负荷与光伏/储能服务曲线',xticks:[0,24,48,72,96,120,144,167],xlabels:a.rows.map(x=>'D'+x.day)});$('energy-balance').innerHTML=`<div class="grid g2 keep2">${metric('所选合成周负荷满足',pct(a.servedShare),'','不是全年供电可靠率')}${metric('合成周未满足电量',fmt(a.unserved/1000,2),'GWh','未自动补入发电机')}</div><div class="mini-stat"><span>期初 / 期末可用储能电量</span><b>${fmt(a.initialSoc,0)} / ${fmt(a.finalSoc,0)} MWh</b></div><div class="mini-stat"><span>合成周弃电 / 总负荷</span><b>${fmt(a.curtailed/1000,2)} / ${fmt(a.loads/1000,2)} GWh</b></div><p class="footnote">初始电池电量单独显示，不能视为免费无限电源。这里采用固定策略，不求系统最优；把储能从约5小时提高到24小时，再切换低光照周，观察时序约束。</p>`;}
function renderSocial(){const a=M.social(state.social);$('social-metrics').innerHTML=metric('平均到全体居民的税后劳动收入',fmt(a.wagesNet,1),'$/人·年','不是就业者平均工资')+metric('扣住房增量后的上述收入',fmt(a.afterHousing,1),'$/人·年','不含家庭其他支出或收入',a.afterHousing<0?'red':'')+metric('新增公共可用收入',fmt(a.revenue,1),'M$/年','税收 + 公共权益分红，不重复计算')+metric('拟新增服务的预算缺口',fmt(a.gap,1),'M$/年','未自动以贷款填补',a.gap>0?'red':'');const parts=[{label:'税后劳动收入',v:a.wagesNet,color:colors.gold},{label:'私人税后资本收益',v:a.privateProfit,color:colors.blue},{label:'税收',v:a.tax,color:colors.green},{label:'公共资产税后收益',v:a.publicDividend,color:colors.violet}];$('social-flow').innerHTML=`<div class="cost-bars">${parts.map(p=>`<div style="width:${p.v/state.social.valueAdded*100}%;background:${p.color}" title="${p.label} ${fmt(p.v,2)}M$">${p.v/state.social.valueAdded>.12?fmt(p.v,1):''}</div>`).join('')}</div><div class="legend">${parts.map(p=>`<span><i style="background:${p.color}"></i>${p.label}</span>`).join('')}</div>${parts.map(p=>`<div class="mini-stat"><span>${p.label}</span><b>${fmt(p.v,2)} M$</b></div>`).join('')}<div class="mini-stat"><span>合计 = 新增增加值</span><b>${fmt(state.social.valueAdded,2)} M$</b></div>`;$('social-diagnosis').innerHTML=`<div class="note ${a.gap>0?'warning':'success'}">新增公共服务最多可支付${fmt(a.delivered,1)} M$/年。${a.gap>0?'拟定目标仍缺资金；提高产量本身没有填平这张财政账。':'本教学假设内覆盖了拟定服务预算，但不能证明现实的医疗教育等已足额保障。'}</div>`;}
function renderFuture(){const f=futureCases[state.future];document.querySelectorAll('[data-future]').forEach(el=>el.classList.toggle('active',el.dataset.future===state.future));$('future-detail').innerHTML=`<span class="tag infer">${f.sub}</span><h2 style="margin-top:15px">${f.title}</h2><p><strong>${f.claim}</strong></p><div class="vignette"><span class="kicker">虚构未来切片 · 不是真实报道</span><p>${f.scene}</p></div><div class="case-section"><h4>成立条件</h4><p>${f.conditions}</p></div><div class="case-section"><h4>观察哪些早期信号？</h4><p>${f.signals}</p></div><button class="btn" data-future-note="${state.future}">把这个分岔带入研究记录 ↗</button>`;}
function renderSources(){const q=sourceQuery.toLocaleLowerCase();const sources=D.sources.filter(s=>(sourceTopic==='all'||s.topic===sourceTopic)&&(!onlySaved||state.bookmarks.includes(s.id))&&([s.title,s.author,s.claim,s.limit,s.id].join(' ').toLocaleLowerCase().includes(q)));$('source-count').textContent=`显示 ${sources.length} / ${D.sources.length} 条。统计数据保留原年份；模型条目不冒充外部实证。`;$('saved-filter').classList.toggle('active',onlySaved);$('source-list').innerHTML=sources.length?sources.map(s=>`<article class="card source-card" id="source-${s.id}"><div class="source-top"><div class="tags"><span class="tag">${s.id}</span><span class="tag ${s.id.startsWith('S')?'fact':'model'}">${esc(s.type)}</span></div><button class="bookmark ${state.bookmarks.includes(s.id)?'saved':''}" data-bookmark="${s.id}" aria-label="${state.bookmarks.includes(s.id)?'取消收藏':'收藏'} ${esc(s.title)}">${state.bookmarks.includes(s.id)?'★':'☆'}</button></div><h3>${esc(s.title)}</h3><div class="meta">${esc(s.author)} · ${esc(s.year)}</div><p>${esc(s.claim)}</p><p class="limitation"><strong>限制与不能推出的结论：</strong>${esc(s.limit)}</p><div class="source-footer"><span class="tag">${esc(s.topic)}</span>${s.url?`<a class="btn small" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">原始来源 ↗</a>`:'<span class="muted smalltext">内部模型 / 交付源码</span>'}</div></article>`).join(''):'<div class="card"><p>没有匹配条目。尝试其他关键词，或取消主题/收藏筛选。</p></div>';}
function renderNotes(){$('note-list').innerHTML=`<div class="card"><h3>研究日志 <span class="tag">${state.notes.length}条</span></h3>${state.notes.length?state.notes.slice().reverse().map(n=>`<article class="journal-item"><div class="row between"><h4>${esc(n.title)}</h4><button class="btn small ghost danger" data-delete-note="${esc(n.id)}">删除</button></div><span class="muted smalltext">${esc(n.date)}</span><p>${esc(n.text)}</p>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" class="break smalltext">查看记录来源 ↗</a>`:''}</article>`).join(''):'<p class="smalltext">尚无记录。可从八个研究问题带入模板，或记录访谈、数据缺口和相反证据。</p>'}</div>`;}
function updateGroup(group){if(group==='finance')renderFinance();else if(group==='cost')renderCost();else if(group==='compute')renderCompute();else if(group==='mineral')renderMineral();else if(group==='ag')renderAg();else if(group==='energy')renderEnergy();else if(group==='social')renderSocial();}
function renderAll(){renderOverview();renderCost();renderCompute();renderAfrica();renderStage();renderFinance();renderMineral();renderAg();renderEnergy();renderSocial();renderFuture();renderSources();renderNotes();Object.keys(bounds).forEach(syncControls);}
function navigate(page,{scroll=true,hash=true}={}){if(!pages.some(p=>p[0]===page))page='overview';state.page=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-nav]').forEach(el=>{el.classList.toggle('active',el.dataset.nav===page);if(el.closest('nav'))el.setAttribute('aria-current',el.dataset.nav===page?'page':'false');});$('breadcrumb').textContent=pages.find(p=>p[0]===page)[3];document.title=pages.find(p=>p[0]===page)[2]+' · AI杠杆下的40亿人工业化';if(hash){try{history.replaceState(null,'','#'+page);}catch(e){}}if(scroll)window.scrollTo({top:0,behavior:'instant'});save();}
function applyMode(){document.body.classList.toggle('guide-mode',state.mode==='guide');document.querySelectorAll('[data-mode]').forEach(el=>{el.classList.toggle('active',el.dataset.mode===state.mode);el.setAttribute('aria-pressed',el.dataset.mode===state.mode?'true':'false');});}
function sourceJump(id){sourceQuery='';sourceTopic='all';onlySaved=false;$('source-search').value='';$('source-topic').value='all';renderSources();navigate('research',{scroll:false});requestAnimationFrame(()=>{const e=$('source-'+id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('source-highlight');requestAnimationFrame(()=>e.classList.add('source-highlight'));}});}
function exportState(){download('后AI_工业化研究备份.json',JSON.stringify({schema:'postai.industrial-futures.v1',exportedAt:new Date().toISOString(),researchSnapshot:D.meta.date,state},null,2));toast('已导出参数、情景、收藏与研究记录。');}
function exportCSV(){const a=M.simulate(D.regions,state.finance);const cols=[['year','年份'],['annualPlan','年度计划_MUSD'],['plan','累计计划_MUSD'],['imp','进口含量_比例'],['ag','农业再投资_MUSD'],['other','其他可动员资金_MUSD'],['mine','矿业分配_MUSD'],['opCash','经营净现金_MUSD'],['maintenance','公共资产维护_MUSD'],['publicSpend','新增公共服务支出_MUSD'],['ownCash','自身可投资金_MUSD'],['ownFx','自身外汇额度_MUSD'],['grant','赠款_MUSD'],['draw','新增贷款_MUSD'],['startCash','期初资金_MUSD'],['startFx','期初外汇额度_MUSD'],['startDebt','期初债务_MUSD'],['interest','应付利息_MUSD'],['principal','应付本金_MUSD'],['payment','实付本息_MUSD'],['unpaid','未足额支付发生额_MUSD'],['investment','实际建设_MUSD'],['imports','进口建设支出_MUSD'],['domestic','非外汇建设支出_MUSD'],['cash','期末资金_MUSD'],['fx','期末外汇额度_MUSD'],['debt','期末债务_MUSD'],['built','累计建设_MUSD'],['completion','物理目标完成率'],['target','目标造价_MUSD'],['solarMW','映射累计光伏_MWp'],['batteryMWh','映射累计储能_MWh'],['housingM2','映射累计住宅_m2'],['cementT','映射累计水泥_t'],['steelT','映射累计钢材_t'],['maintenanceGap','基本支出资金缺口_MUSD'],['fxOperatingGap','基本支出外汇缺口_MUSD'],['binding','约束']];const csvcell=x=>{let s=typeof x==='number'?String(+x.toFixed(8)):String(x);if(/^[=+@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download('后AI_年度账本_'+state.finance.region+'.csv','\ufeff'+[cols.map(c=>csvcell(c[1])).join(','),...a.rows.map(r=>cols.map(c=>csvcell(r[c[0]])).join(','))].join('\r\n'),'text/csv;charset=utf-8');}
function exportBrief(){const a=M.simulate(D.regions,state.finance),r=D.regions[state.finance.region];const lines=['# AI杠杆下的40亿人工业化｜研究简报','','研究快照：2026-10-23；导出：'+new Date().toISOString(),'','## 核心问题','第一座工厂之后，谁来建设第二座？将消费扩散、生产能力扩散与收益扩散分开。','','## 当前条件实验','原型：'+r.name+'；每100万人；2027—2051；百万不变美元。','物理目标完成率：'+pct(a.last.completion),'累计建设：'+fmt(a.last.built,2)+' MUSD；累计进口：'+fmt(a.totalImports,2)+' MUSD。','期末债务：'+fmt(a.last.debt,2)+' MUSD。','','参数：','```json',JSON.stringify(state.finance,null,2),'```','','结果是给定假设下的条件推演，不是国别预测。外汇不能与现金相加。没有人口增长、汇率、一般均衡、逐国财政或全年可靠供电验证。','','## 已保存情景',...state.pins.map(p=>{const s=M.simulate(D.regions,p.params);return '- '+p.name+'：完成'+pct(s.last.completion)+'；期末债务'+fmt(s.last.debt,2)+' MUSD。';}),'','## 研究记录'];state.notes.forEach(n=>lines.push('','### '+n.title,n.date,'',n.text,n.url?'来源：'+n.url:''));lines.push('','## 收藏的证据');const sources=state.bookmarks.length?D.sources.filter(s=>state.bookmarks.includes(s.id)):D.sources;for(const s of sources)lines.push('',`### ${s.id}｜${s.title}`,`${s.author}，${s.year}。`,s.claim,'限制：'+s.limit,s.url||'内部模型；详见交付源码与方法文件。');download('后AI_工业化研究简报.md',lines.join('\n'),'text/markdown;charset=utf-8');toast('已导出当前模型与研究记录简报。');}
function addNote(){const title=$('note-title').value.trim(),text=$('note-body').value.trim(),url=$('note-url').value.trim();if(!title||!text){toast('请填写研究标题与至少一条观察。');return;}if(url&&!/^https?:\/\//i.test(url)){toast('来源地址仅接受 http 或 https。');return;}if(state.notes.length>=100){toast('当前最多100条记录，请先导出归档。');return;}state.notes.push({id:'n'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:title.slice(0,200),text:text.slice(0,12000),url:url.slice(0,1000),date:new Date().toLocaleString('zh-CN')});$('note-title').value='';$('note-body').value='';$('note-url').value='';save();renderNotes();toast(storageOK?'研究记录已保存在当前浏览器。':'本次记录在页面内；存储不可用，请导出备份。');}
function noteTemplate(title,text){navigate('research',{scroll:false});$('note-title').value=title;$('note-body').value=text;$('note-url').value='';$('note-title').scrollIntoView({behavior:'smooth',block:'center'});$('note-title').focus({preventScroll:true});}
function preset(name){const region=state.finance.region;state.finance={...M.DEFAULT_FINANCE,region};if(name==='cost')state.finance.costCut=30;if(name==='dear')state.finance.rate=9;if(name==='resource')state.finance.shock='resource';if(name==='none'){state.finance.grant=0;state.finance.loan=0;}if(name==='learning')state.finance.localization='progress';syncControls('finance');renderFinance();save();toast('已应用情景；其他参数恢复为同原型基准。');}
function init(){const nav=pages.map(p=>`<button data-nav="${p[0]}"><span>${p[1]}</span>${p[2]}</button>`).join('');$('nav').innerHTML=nav;$('mobile-nav').innerHTML=pages.map(p=>`<button data-nav="${p[0]}">${p[1]} ${p[2]}</button>`).join('');$('pages').innerHTML=[overviewPage(),leveragePage(),africaPage(),capabilityPage(),financePage(),physicalPage(),lifePage(),futuresPage(),researchPage()].join('');renderAll();applyMode();const fromHash=location.hash.slice(1);navigate(pages.some(p=>p[0]===fromHash)?fromHash:state.page,{scroll:false});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-case],[data-year]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return;}if(b.dataset.ref){sourceJump(b.dataset.ref);return;}if(b.dataset.mode){state.mode=b.dataset.mode;applyMode();save();return;}if(b.dataset.case){state.case=b.dataset.case;renderAfrica();save();return;}if(b.dataset.maplayer){state.maplayer=b.dataset.maplayer;renderAfrica();save();return;}if(b.dataset.runCase){state.finance.region=b.dataset.runCase;syncControls('finance');renderFinance();navigate('finance');return;}if(b.dataset.stage!=null){state.stage=+b.dataset.stage;renderStage();save();return;}if(b.dataset.preset){preset(b.dataset.preset);return;}if(b.dataset.year){state.year=+b.dataset.year;renderFinance();save();return;}if(b.dataset.loadPin!=null){state.finance=clone(state.pins[+b.dataset.loadPin].params);syncControls('finance');renderFinance();save();toast('已载入保存的情景参数。');return;}if(b.dataset.deletePin!=null){state.pins.splice(+b.dataset.deletePin,1);renderFinance();save();return;}if(b.dataset.future){state.future=b.dataset.future;renderFuture();save();return;}if(b.dataset.bookmark){const id=b.dataset.bookmark;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];renderSources();save();return;}if(b.dataset.noteQuestion){const q=D.questions.find(q=>q.id===b.dataset.noteQuestion);noteTemplate(q.id+'｜'+q.title,`工作假说：${q.claim}\n\n反方：${q.counter}\n\n待验证：${q.test}\n\n需要数据：${q.data}\n\n我的观察与下一步：\n`);return;}if(b.dataset.futureNote){const f=futureCases[b.dataset.futureNote];noteTemplate('未来分岔｜'+f.title,`条件：${f.conditions}\n\n早期信号：${f.signals}\n\n支持证据：\n\n反例：\n\n待验证：`);return;}if(b.dataset.deleteNote){if(confirm('删除这条本地研究记录？导出的备份不受影响。')){state.notes=state.notes.filter(n=>n.id!==b.dataset.deleteNote);renderNotes();save();}return;}
switch(b.id){case 'global-export':case 'export-state':exportState();break;case 'presentation-btn':document.body.classList.toggle('presentation');b.textContent=document.body.classList.contains('presentation')?'退出演示':'演示视图';break;case 'pin-scenario':if(state.pins.length>=3){toast('最多保存3组，请先删除一组对照。');break;}state.pins.push({name:D.regions[state.finance.region].short+' / '+(state.finance.costCut?'降本'+state.finance.costCut+'%':state.finance.shock!=='none'?'压力情景':'融资'+state.finance.rate+'%')+' #'+(state.pins.length+1),params:clone(state.finance)});renderFinance();save();toast('已保存当前情景，可继续调整参数比较。');break;case 'export-csv':exportCSV();break;case 'saved-filter':onlySaved=!onlySaved;renderSources();break;case 'add-note':addNote();break;case 'export-brief':exportBrief();break;case 'import-state':$('import-file').click();break;case 'reset-models':for(const g of Object.keys(bounds))state[g]=clone(DEFAULT[g]);state.year=25;state.case='CU';Object.keys(bounds).forEach(syncControls);renderAll();save();toast('实验参数已恢复默认；收藏、笔记和保存的情景保留。');break;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-case]')){e.preventDefault();state.case=e.target.dataset.case;renderAfrica();save();}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='source-search'){sourceQuery=t.value;renderSources();return;}if(t.id==='finance-year'){state.year=+t.value;renderFinance();save();return;}if(t.type==='range'&&t.dataset.group){const g=t.dataset.group,k=t.dataset.key;state[g][k]=+t.value;const out=$(`out-${g}-${k}`);if(out)out.textContent=formatControl(g,k,state[g][k]);updateGroup(g);save();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='source-topic'){sourceTopic=t.value;renderSources();return;}if(t.dataset.gate!=null){const cs=state.checks[state.stage]||[false,false,false];cs[+t.dataset.gate]=t.checked;state.checks[state.stage]=cs;renderStage();save();return;}if(t.dataset.group&&t.type!=='range'){const g=t.dataset.group,k=t.dataset.key;state[g][k]=t.type==='checkbox'?t.checked:k==='burden'?+t.value:t.value;updateGroup(g);save();}});
$('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('文件超过5MB，不是本系统预期的研究备份。');const raw=JSON.parse(await file.text());if(raw.schema!=='postai.industrial-futures.v1'||!raw.state)throw Error('不是受支持的后AI研究备份格式。');if(!confirm('导入将替换当前浏览器中的参数、收藏、情景与记录。已导出的备份不受影响。继续？'))return;state=sanitize(raw.state);renderAll();applyMode();navigate(state.page);save();toast('研究备份已导入并重新计算。');}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1),{hash:false}));
}
init();
})();
</script></body></html>
