&lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i&gt;&lt;/i&gt;继承 / 修改 / 成员重组 / 支持&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;comparison&quot;&gt;&lt;/i&gt;受限配置对比&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;challenge&quot;&gt;&lt;/i&gt;审计反证&lt;/span&gt;&lt;/div&gt;

&lt;section id=&quot;panel-evidence&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-evidence&quot; hidden&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;可追溯的发现索引&lt;/h2&gt;&lt;span class=&quot;scope&quot;&gt;完整收入 488 条归档 finding&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;scope&quot;&gt;finding 是记录单位，不等于独立实验。保留原始英文标题、历史阶段标签和归档行号；所有记录的来源质量均为 legacy_weak。&lt;/p&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label class=&quot;search-label&quot;&gt;搜索标题、产物或 peer&lt;input id=&quot;finding-search&quot; type=&quot;search&quot; placeholder=&quot;例如：leak、sectorjoint、gen3_peer4&quot;&gt;&lt;/label&gt;&lt;label&gt;代次&lt;select id=&quot;finding-generation&quot;&gt;&lt;option value=&quot;all&quot;&gt;全部代次&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;gen0&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;gen1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;gen2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;gen3&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;记录类型&lt;select id=&quot;finding-type&quot;&gt;&lt;option value=&quot;all&quot;&gt;全部类型&lt;/option&gt;&lt;option value=&quot;result&quot;&gt;result&lt;/option&gt;&lt;option value=&quot;insight&quot;&gt;insight&lt;/option&gt;&lt;option value=&quot;error&quot;&gt;error&lt;/option&gt;&lt;option value=&quot;late_result_signal&quot;&gt;late_result_signal&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p id=&quot;finding-count&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div id=&quot;finding-detail&quot; class=&quot;finding-detail&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;finding-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th class=&quot;claim&quot;&gt;发现标题 · 点击查看&lt;/th&gt;&lt;th&gt;代次 / peer&lt;/th&gt;&lt;th&gt;阶段标签&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;记录分数&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;finding-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;独立保留的官方提交记录：109 个 attempt ID&lt;/summary&gt;&lt;p class=&quot;scope&quot;&gt;其中 104 个有数值成绩。findings 引用了 149 个不同官方 attempt ID，因此这里不是整个运行的全部提交。按 attempt ID 去重，原始位置可查。&lt;/p&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;产物 / 来源&lt;/th&gt;&lt;th&gt;提交时间 UTC&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;官方角误差 rad ↓&lt;/th&gt;&lt;th&gt;状态&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;attempt-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section id=&quot;panel-dynamics&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-dynamics&quot; hidden&gt;
&lt;h2&gt;成绩随研究推进而改善&lt;/h2&gt;&lt;p class=&quot;scope&quot;&gt;每代已提交 frontier 的最佳官方分数；连线只表示代次顺序。相对 gen0 最佳下降 0.07824 rad（6.90%），不是单个机制的贡献。&lt;/p&gt;
&lt;svg class=&quot;chart&quot; id=&quot;score-chart&quot; role=&quot;img&quot; aria-label=&quot;各代最佳角误差：1.13450、1.09369、1.06284、1.05626；铜牌门槛 1.018571&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;代次&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;finding&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;不同产物名&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;保留 attempt&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;有数值评分&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;历史 mature=true&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;generation-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;scope&quot;&gt;产物名可对应计划、诊断或重试，不能当作机制广度；mature=true 是历史字段，不代表本次独立验证。&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;&lt;article&gt;&lt;h2&gt;证据标签的覆盖范围&lt;/h2&gt;&lt;div id=&quot;stage-bars&quot;&gt;&lt;/div&gt;&lt;p class=&quot;scope&quot;&gt;各类为记录上的互斥标签分组，不是实验逐级晋升漏斗。历史 mature=true 共 147 条；其余包括 false 或未标注。&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;h2&gt;规划未通过，代次仍有提交&lt;/h2&gt;&lt;div id=&quot;planning&quot;&gt;&lt;/div&gt;&lt;p class=&quot;scope&quot;&gt;四次 PI / Chair 综合规划均为 failed_non_strict；gen4 没有实际执行。Gems 记录为 0，不能把 notebook 复用归功于 Gems。&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
&lt;h2&gt;框架指标的可计算性&lt;/h2&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;指标&lt;/th&gt;&lt;th&gt;本次可报告什么&lt;/th&gt;&lt;th&gt;缺少什么&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;广度 / 熵&lt;/td&gt;&lt;td&gt;每代不同产物名与记录类型分布&lt;/td&gt;&lt;td&gt;统一且经人工复核的机制分类、完整候选集合&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;继承深度&lt;/td&gt;&lt;td&gt;已核实 recipe → aux → v3 → 后代扩展链&lt;/td&gt;&lt;td&gt;全体产物身份及完整 parent 边&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;证据转化率 / 继承率&lt;/td&gt;&lt;td&gt;标签覆盖与已核实使用案例&lt;/td&gt;&lt;td&gt;实验分母、同一证据跨状态的完整转移&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;失败避免率 / 重组收益率&lt;/td&gt;&lt;td&gt;取消旧拟合方案、七成员失败等个案&lt;/td&gt;&lt;td&gt;暴露于负证据的机会集合、可比对照与全部重组尝试&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;panel-assessment&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-assessment&quot; hidden&gt;
&lt;h2&gt;最接近受控比较的局部实验：分区基准&lt;/h2&gt;&lt;p&gt;保持十成员集合与拟合配置，改变用于划分方向区域的成员预测，再拟合对应权重。v1_lgb 在这些已测候选中最好。&lt;/p&gt;
&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;分区基准&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;八成员 h8 / rad ↓&lt;/th&gt;&lt;th class=&quot;numeric&quot;&gt;十成员官方 / rad ↓&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;anchor-rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p class=&quot;scope&quot;&gt;h8 与官方列对应不同成员范围、权重和评估集，不能直接相减解释泛化差距。v2 → v1_lgb 官方差异为 −0.00206 rad；官方反馈参与选择，缺少重复运行和独立冻结测试。&lt;/p&gt;
&lt;div class=&quot;two&quot;&gt;&lt;article&gt;&lt;h3&gt;本地 h8 验证&lt;/h3&gt;&lt;p&gt;8 成员 · batch 500&lt;br&gt;排除 geo25 与 qwm_pos&lt;br&gt;独立拟合 W_h8&lt;/p&gt;&lt;strong&gt;1.0554427 rad&lt;/strong&gt;&lt;/article&gt;&lt;article&gt;&lt;h3&gt;实际最终提交&lt;/h3&gt;&lt;p&gt;10 成员 · 全量预测&lt;br&gt;含 2 种物理成员&lt;br&gt;另一套拟合权重 W6&lt;/p&gt;&lt;strong&gt;1.05626 rad · 无奖牌&lt;/strong&gt;&lt;/article&gt;&lt;/div&gt;
&lt;div class=&quot;notice&quot;&gt;h8 的低分不能直接证明十成员提交通过相同配置的独立验证。拟合批次 350 还存在后续重叠反证；“clean”仅作为方案名保留。&lt;/div&gt;
&lt;h2&gt;五个研究问题，目前能回答到哪一步&lt;/h2&gt;&lt;div class=&quot;questions&quot;&gt;
&lt;article&gt;&lt;h3&gt;RQ1 后代是否更有效？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;成绩改善已记录&lt;/span&gt;&lt;p&gt;四代最佳分数逐步降低。实验产率是否提高仍未知，因为完整实验数量、失败重试与资源用量不可得。&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h3&gt;RQ2 改善来自证据继承吗？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;复用事实较强 · 因果效应未知&lt;/span&gt;&lt;p&gt;读取日志、改编代码与后代评分形成证据链；缺少关闭共享证据渠道的可比对照，无法估计继承效应。&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h3&gt;RQ3 负结果减少浪费了吗？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;有改变计划的个案&lt;/span&gt;&lt;p&gt;peer8 停止了旧 FIT-9 方案，七成员扩展未过门槛。无法据此计算总体失败避免率；v4 地图修正是否传至最终 peer 也未证实。&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h3&gt;RQ4 分支重组有效吗？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;存在重组 · 收益率未知&lt;/span&gt;&lt;p&gt;最终方案组合多成员预测与他人配方；同时存在增加成员导致退步的案例。不能把赢家中的重组等同于所有重组有收益。&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h3&gt;RQ5 更经济吗？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;当前不可估计&lt;/span&gt;&lt;p&gt;已知墙钟时长 26.57 小时。GPU 用量记录为 usage_unknown，美元与有效实验分母不完整；不将并行墙钟时间当作 GPU 小时。&lt;/p&gt;&lt;/article&gt;
&lt;article&gt;&lt;h3&gt;同任务对照能说明什么？&lt;/h3&gt;&lt;span class=&quot;badge&quot;&gt;描述性对照&lt;/span&gt;&lt;p&gt;此前 Claude Code 包为 1.00493、银牌，本次为 1.05626、无奖牌。模型、预算与反馈协议尚未匹配，不能当作架构消融。&lt;/p&gt;&lt;/article&gt;
&lt;/div&gt;
&lt;h2&gt;优先补验&lt;/h2&gt;&lt;ol&gt;&lt;li&gt;核实每个基础成员的训练批次，解决 v4 / batch 350 的记录冲突。&lt;/li&gt;&lt;li&gt;冻结十成员、分区与权重，在全新保留集上同时评估八成员和十成员方案。&lt;/li&gt;&lt;li&gt;在同模型、同预算、多随机种子的条件下，对共享发现渠道与规划修复分别做消融。&lt;/li&gt;&lt;/ol&gt;
&lt;/section&gt;

  const tooltipId = `codex-visualization-tooltip-${

  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {

  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

    const tab = event.target?.closest?.(selector);

      return;

      selectTab(tab);
      return;

    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
