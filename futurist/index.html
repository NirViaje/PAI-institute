","author":"OECD","date":"2025","url":"https://www.oecd.org/en/publications/foresight-toolkit-for-resilient-public-policy_bcdd9304-en.html","note":"将假设审视、未来情景与战略压力测试连接起来。本原型评分由作者示例设定，可修改，没有政策效果估计。"},{"id":"R08","kind":"公开实践","title":"Futures Garden","en":"Futures Garden","author":"EU Policy Lab / JRC","date":"项目介绍","url":"https://knowledge-for-policy.ec.europa.eu/projects-activities/futures-garden_en","note":"用未来物件、影片与参与过程连接前瞻和政策讨论。公开项目存在，不等于其长期政策成效已经得到因果验证。"},{"id":"P01","kind":"项目材料","title":"AI与社会的共同演化","en":"本对话附带材料","author":"后AI研究讨论材料","date":"项目推演","url":"","note":"采用“技术能力—可靠性与成本—组织重构—分配—人的生活”研究链。材料中的未来时间窗口作为条件性推演，不直接转换成事件预测。"},{"id":"P02","kind":"项目材料","title":"开放系统与AI生态开放度","en":"本对话附带材料","author":"后AI研究讨论材料","date":"工作性概念","url":"","note":"采用资源、行动、持续性、复制、遗传、变异与选择等维度。“AI生态开放度”是项目工作框架，不是经验证的单一量表。"},{"id":"P03","kind":"项目材料","title":"机器文明：目标连续性与使命生态","en":"本对话附带材料","author":"机器文明的意义危机与使命生态：跨学科文献调研","date":"研究议题","url":"","note":"区分主体体验、目标内容、集体协调与使命正当性。“使命生态”是综合研究概念，不能据此认定机器有意识或必然追求扩张。"},{"id":"P04","kind":"项目材料","title":"Human-Fit：适人性研究","en":"本项目材料","author":"适人性 benchmark 研究方案","date":"研究设计","url":"","note":"关注学习迁移、判断、自主性与真实社会关系。界面中的影响条仅为情景刻画，不是实测 Human-Fit 分数。"}],"policies":[{"id":"P1","title":"记忆可迁移与授权撤回","short":"迁移与撤回","desc":"检查用户迁移服务与撤销授权的实际成本。","scores":[1,2,2,1,1,0,1,1],"reason":"可降低绑定，但依赖兼容标准与执行机制；跨远程节点的可执行性有限。"},{"id":"P2","title":"认知支架与迁移测评","short":"能力与学习","desc":"同时评价协作表现和撤去AI后的独立表现。","scores":[2,2,1,2,1,0,0,1],"reason":"直接对应人类学习情境；不应把人的认知量表直接用于机器主体。"},{"id":"P3","title":"公共算力与服务兜底","short":"公共可及","desc":"探索普通人获得服务的渠道与持续成本。","scores":[1,2,-1,1,2,-1,0,1],"reason":"在公共和地方情景中较匹配；也可能增加财政负担、平台依赖或远程供给困难。"},{"id":"P4","title":"关键系统独立审计","short":"独立审计","desc":"为权限、责任和关键失败建立外部检查。","scores":[1,2,1,1,1,1,1,2],"reason":"跨情景均有讨论价值；审计能力、独立性与整改执行仍是必要条件。"},{"id":"P5","title":"复制的分阶段许可","short":"复制治理","desc":"将持续自主复制与普通部署分开审查。","scores":[0,0,0,0,0,2,1,0],"reason":"更适合高生态开放度情景；对一般助手可能不适用，不应无限扩大限制。"},{"id":"P6","title":"紧急降级与人工替代","short":"降级与恢复","desc":"通过演练保留服务 function coneChart(){const x0=75, xe=700, cy=235;const X=y=>x0+(y-2026)/34*(xe-x0);const endpoint={possible:154,plausible:104,probable:49};let out=`<svg class="cone" viewBox="0 0 900 460" role="group" aria-label="可交互未来锥。点击情景节点查看假设。"><defs><pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#608498" opacity=".2"/></pattern><linearGradient id="poss" x1="0" x2="1"><stop stop-color="#b3a5e3" stop-opacity=".015"/><stop offset="1" stop-color="#b3a5e3" stop-opacity=".1"/></linearGradient><linearGradient id="plau" x1="0" x2="1"><stop stop-color="#83b9d3" stop-opacity=".025"/><stop offset="1" stop-color="#83b9d3" stop-opacity=".13"/></linearGradient><linearGradient id="prob" x1="0" x2="1"><stop stop-color="#7ae0c1" stop-opacity=".02"/><stop offset="1" stop-color="#7ae0c1" stop-opacity=".2"/></linearGradient></defs><rect x="18" y="25" width="855" height="400" fill="url(#dotgrid)" rx="12"/>`;

out+=`<path d="M${x0} ${cy}H795" stroke="#8fb7b3" stroke-opacity=".5" stroke-dasharray="6 6"/><text x="786" y="229" class="axistext" style="fill:#99c4ba">投射基线</text><text x="760" y="92" fill="#a99acd" font-size="10">可能 Possible</text><text x="760" y="140" fill="#8daec8" font-size="10">可信 Plausible</text><text x="760" y="188" fill="#8ed4bd" font-size="10">较可能 Probable</text><text x="80" y="60" class="axistext" style="letter-spacing:1.8px;font-size:8px">MANY FUTURES, NOT ONE FORECAST</text><text x="755" y="405" class="axistext" style="font-size:9px">潜在未来不限于图内</text>`;
const scan=X(state.year);out+=`<line class="scanline" x1="${scan}" y1="44" x2="${scan}" y2="418"/><rect x="${scan-22}" y="30" width="44" height="17" rx="4" fill="#285144"/><text x="${scan}" y="42" fill="#b5ebd7" font-size="9" text-anchor="middle">${state.year}</text><circle cx="${x0}" cy="${cy}" r="20" fill="#7ae0c108" stroke="#7ae0c132"/><circle cx="${x0}" cy="${cy}" r="10" fill="#18382f" stroke="#7ae0c1"/><circle cx="${x0}" cy="${cy}" r="3.2" fill="#c9fae9"/><text x="${x0}" y="${cy+38}" fill="#b6cfcf" font-size="11" text-anchor="middle">复数现在</text><text x="${x0}" y="${cy+54}" class="axistext" text-anchor="middle">2026 · 工作起点</text>`;
const positions=new Map(), occupied=[];
state.scenarios.forEach(s=>{const x=X(s.year),t=(s.year-2026)/34,amp=(s.cat==='probable'?34:s.cat==='plausible'?84:s.cat==='possible'?143:198)*Math.pow(t,.76),y=cy+(s.band<0?-1:1)*amp,lw=Math.min(224,24+s.title.length*11);const special={S04:[-90,28],S08:[13,48],S03:[13,-26]};const options=[special[s.id]||[13,-26],[13,-26],[-lw-14,-26],[13,22],[-lw-14,22],[13,-70],[-lw-14,-70],[13,70],[-lw-14,70]];let best=null;
for(const [dx,dy] of options){const lx=Math.max(22,Math.min(856-lw,x+dx)),ly=Math.max(16,Math.min(397,y+dy));let cost=0;for(const r of occupied){const w=Math.max(0,Math.min(lx+lw+7,r.x+r.w)-Math.max(lx-7,r.x)),h=Math.max(0,Math.min(ly+46,r.y+39)-Math.max(ly-7,r.y));cost+=w*h;}if(!best||cost<best.cost)best={x,y,lx,ly,lw,cost};if(cost===0)break;}positions.set(s.id,best);occupied.push({x:best.lx,y:best.ly,w:lw});});

function play(){if(playing){stopPlay();return;}if(state.year>=2060)updateYear(2030);$('#playButton').textContent='Ⅱ';$('#playButton').setAttribute('aria-label','暂停观察窗口');playing=setInterval(()=>{if(view!=='explore'||state.year>=2060){stopPlay();return;}updateYear(state.year+1);},650);}
function insights(s){const list=[];if(s.metrics.tech>75&&s.metrics.access<55)list.push({title:'能力扩散，不等于收益普惠',body:'当前情景同时设定高能力与低可及。应追问所有权、服务价格、迁移成本和议价能力。',rule:'能力扩散 > 75 且公共可及 < 55',method:'M04'});if(s.metrics.openness>70)list.push({title:'把工程自主与目标自主分开',body:'高生态开放度下，先验证能源、维护与复制链，再讨论目标漂移；通信延迟也不等于必然失控。',rule:'生态开放 > 70',method:'M07'});if(s.metrics.agency<50)list.push({title:'先检查实际控制，再谈“人在回路”',body:'名义授权可能不等于实际控制。请为撤回、申诉、降级与责任对应设计一个可操作场景。',rule:'人类控制 < 50',method:'M06'});if(s.metrics.access>=65&&s.metrics.agency>=65)list.push({title:'可取，不代表会自动发生',body:'这个情景刻画了较高可及性与控制权。下一步应回推经费、授权与独立复核的必要条件。',rule:'公共可及 ≥ 65 且人类控制 ≥ 65',method:'M08'});if(['S01','S04'].includes(s.id))list.push({title:'把“完成任务”与“形成能力”分开',body:'将使用AI时的表现、撤去AI后的表现与迁移任务分别记录，不用即时满意度替代长期影响。',rule:'学习与认知主题',method:'M06'});list.push({title:'谁还没有进入这个未来？',body:OBS[state.observer].description+' 这是演示偏好规则，应请真实利益相关者表达并保留分歧。',rule:'所有情景：观察者反思',method:'M05'});list.push({title:'保留一个真正不同的替代世界',body:'当前分类是工作假设，不是事件概率。尝试增加相反制度、失败条件或约束社会，而不是只改变年份。',rule:'所有情景：复数性检查',method:'M02'});return list.slice(0,3);}
function renderMethods(){const visible=DATA.methods.filter(m=>(methodFilter==='全部'||m.stage===methodFilter)&&(!methodQuery||JSON.stringify(m).toLowerCase().includes(methodQuery.toLowerCase())));return intro(`<button class="btn" data-act="insights">${I('spark','sm')}为当前情景选方法</button>`)+`<div class="filter-row">${['全部','打开可能','深挖结构','体验协商','走向行动'].map(t=>`<button class="pill ${methodFilter===t?'active':''}" data-act="method-filter" data-filter="${t}">${t}</button>`).join('')}<span class="grow"></span><span class="faint" style="font-size:10px">${visible.length} 种方法 · 操作步骤为工作台建议</span></div><div class="method-grid">${visible.map(m=>`<article class="method-card"><div class="row between"><span class="method-symbol">${I(m.icon)}</span>${badge(m.stage,'outline')}</div><h3>${m.title}</h3><div class="en mono">${m.en}</div><p>${m.desc}</p><div class="card-actions"><button class="link-btn" data-act="method" data-id="${m.id}">查看方法 ${I('arrow','sm')}</button><button class="btn small ghost" data-act="toolkit" data-id="${m.id}">${I(state.toolkit.includes(m.id)?'check':'plus','sm')}${state.toolkit.includes(m.id)?'已加入':'组合'}</button></div></article>`).join('')}</div>${visible.length?'':'<div class="empty">没有匹配的方法。</div>'}<div class="workflow"><div class="row between"><div><h3 style="font-size:13px">我的研究方法链</h3><p class="small-note">按加入顺序排列，作为项目路线草稿；不是所有研究都必须经过全部步骤。</p></div><button class="btn small" data-act="export-md">导出方法链 ${I('download','sm')}</button></div><div class="workflow-nodes">${state.toolkit.map((id,i)=>{const m=DATA.methods.find(x=>x.id===id);return `${i?I('arrow','sm'):''}<div class="flow-node">${m.title}<button data-act="toolkit" data-id="${id}" aria-label="移除${m.title}">×</button></div>`;}).join('')||'<span class="faint">从方法卡片中选择“组合”，开始建立自己的研究路径。</span>'}</div></div><div class="section-heading"><h2>已经进入实践的形式</h2><span class="faint" style="font-size:10px">公开成果 ≠ 因果成效证明</span></div><div class="cases-grid">${[{id:'R02',label:'政府工具链',title:'让前瞻进入政策流程',text:'标准化工具、工作路径与案例资源；可直接借鉴其操作结构。'},{id:'R08',label:'公共参与',title:'Futures Garden',text:'通过未来物件与参与过程，将情景转为可以讨论的日常遭遇。'},{id:'R05',label:'能力建设',title:'未来素养实验',text:'把“如何使用未来”本身变成学习与反思对象。'},{id:'R07',label:'稳健行动',title:'韧性政策工具包',text:'将假设、情景与战略压力测试连接，而非只交付一份未来报告。'}].map(c=>`<article class="case-card">${badge(c.label)}<h3>${c.title}</h3><p>${c.text}</p><a href="${ref(c.id).url}" target="_blank" rel="noopener noreferrer">${c.id} · 查看一手资料 ↗</a></article>`).join('')}</div>`;}
function baseScore(p,s){const key=p.id+'|'+s.id;let n=state.assess[key]?.score;if(!Number.isFinite(n)){const i=DATA.scenarios.findIndex(x=>x.id===s.id);n=i<0?0:p.scores[i];}return n;}
function evalScore(p,s){let n=baseScore(p,s),delta=0,reason='无额外冲击。';if(state.shock==='energy'){if(['P3'].includes(p.id)){delta=-1;reason='能源紧缩：公共供给的持续成本增加（演示规则 −1）。';}else if(p.id==='P6'){delta=1;reason='能源紧缩：保留降级流程更有讨论价值（演示规则 +1）。';}}else if(state.shock==='outage'){if(p.id==='P6'||(p.id==='P1'&&s.metrics.openness<70)){delta=1;reason='服务中断：替代与迁移能力更关键（演示规则 +1）。';}else if(p.id==='P3'&&s.metrics.openness>70){delta=-1;reason='服务中断：远程公共供给更难成立（演示规则 −1）。';}}return {score:Math.max(-2,Math.min(2,n+delta)),base:n,delta,reason};}
function compScenes(){return state.compare.map(id=>state.scenarios.find(s=>s.id===id)).filter(Boolean);}
function renderWind(){const scenes=compScenes(),pol=DATA.policies.filter(p=>state.policies.includes(p.id));return intro(`<button class="btn primary" data-act="run-wind">${I('wind','sm')}生成测试摘要</button>`)+`<div class="notice">${I('info','sm')}<span>这里是可编辑的工作坊判断矩阵。分值由原型作者示例设置，不是预测、实测政策效果或法律建议。点击单元格可修改评分并补充理由；新增情景默认记为 0（待判断）。</span></div><div class="sub-grid"><aside class="stack"><section class="panel"><div class="panel-head"><h2>参与测试的情景</h2><span class="badge outline">${scenes.length} / 4</span></div><div class="panel-body" style="padding-top:0"><div class="policy-options">${state.scenarios.map(s=>`<label class="checkitem"><input type="checkbox" data-change="compare" value="${esc(s.id)}" ${state.compare.includes(s.id)?'checked':''}><span>${esc(s.title)}<small>${s.id} · ${s.year} · ${CATS[s.cat].cn}</small></span></label>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><h2>政策组合</h2></div><div class="panel-body" style="padding-top:0"><div class="policy-options">${DATA.policies.map(p=>`<label class="checkitem"><input type="checkbox" data-change="policy" value="${p.id}" ${state.policies.includes(p.id)?'checked':''}><span>${p.title}</span></label>`).join('')}</div></div></section></aside><div class="stack"><section class="panel"><div class="panel-head"><div><h2>跨情景政策矩阵</h2><div class="panel-sub">判断收益与代价，保留失败条件</div></div><select class="compact-select" data-change="shock" aria-label="压力测试冲击"><option value="none" ${state.shock==='none'?'selected':''}>无额外冲击</option><option value="energy" ${state.shock==='energy'?'selected':''}>能源与算力紧缩</option><option value="outage" ${state.shock==='outage'?'selected':''}>持续服务中断</option></select></div><div class="table-scroll"><table class="data-table"><thead><tr><th>政策 / 情景</th>${scenes.map(s=>`<th><span class="mono mint">${esc(s.id)}</span><br>${esc(s.title)}</th>`).join('')}</tr></thead><tbody>${pol.map(p=>`<tr><td><b style="font-weight:500">${p.short}</b><br><small class="faint">${p.id}</small></td>${scenes.map(s=>{const e=evalScore(p,s);return `<td><button class="score score${e.score}" data-act="score" data-p="${p.id}" data-s="${esc(s.id)}" aria-label="${p.title}，${esc(s.title)}，评分${e.score}，点击编辑">${e.score>0?'+':''}${e.score}</button></td>`;}).join('')}</tr>`).join('')}</tbody></table>${!scenes.length||!pol.length?'<div class="empty">请选择至少两个情景和一项政策，构建比较。</div>':''}</div><div class="matrix-legend">${[[-2,'明显冲突'],[-1,'存在代价'],[0,'待判断 / 不适用'],[1,'有条件支持'],[2,'较强支持']].map(([v,n])=>`<span><i class="score${v}"></i>${v>0?'+':''}${v} ${n}</span>`).join('')}</div><div class="assess-note">冲击调整与基线评分分开保留，结果截断在 −2 至 +2。${state.shock==='none'?'当前未应用额外冲击。':'点击单元格可查看具体调整规则。'} 方法参考 ${refBtns(['R07','R02'])}</div></section><div id="windSummary">${windSummary()}</div><section class="panel"><div class="panel-head"><h2>保留你的反例与分歧</h2><span class="faint" style="font-size:10px">自动保存</span></div><div class="panel-body" style="padding-top:0"><textarea class="field" data-input="notes" placeholder="哪一个判断存在争议？什么证据会使你改变看法？不要用一个平均分抹掉这些分歧。">${esc(state.notes)}</textarea></div></section></div></div>`;}
function windSummary(){const scenes=compScenes(),pol=DATA.policies.filter(p=>state.policies.includes(p.id));if(scenes.length<2||!pol.length)return '<div class="notice soft">至少选择两个情景和一项政策，才能检查跨情景表现。</div>';const all=pol.map(p=>({p,vals:scenes.map(s=>evalScore(p,s).score)}));const good=all.filter(x=>x.vals.every(n=>n>=1)),conditional=all.filter(x=>x.vals.some(n=>n<0)),unknown=all.filter(x=>x.vals.some(n=>n===0));return `<div class="result-grid"><div class="result-item"><span class="result-number">${good.length.toString().padStart(2,'0')}</span><h3>当前矩阵中的稳健候选</h3><p>${good.map(x=>x.p.short).join('、')||'暂未出现跨情景均获支持的选项。'}<br>规则：每个所选情景分数均 ≥ +1。</p></div><div class="result-item"><span class="result-number" style="color:var(--amber)">${conditional.length.toString().padStart(2,'0')}</span><h3>需要特别检查代价</h3><p>${conditional.map(x=>x.p.short).join('、')||'当前判断未标记负分，不等于不存在代价。'}<br>规则：至少一个情景出现负分。</p></div><div class="result-item"><span class="result-number" style="color:var(--blue)">${unknown.length.toString().padStart(2,'0')}</span><h3>仍有未决或不适用项</h3><p>${unknown.map(x=>x.p.short).join('、')||'没有零分项；仍应检查证据是否充分。'}<br>规则：至少一个情景为 0。</p></div></div><p class="small-note">摘要只是当前输入的逻辑归纳，不是对政策的独立验证。改变评分或冲击，结论会相应改变。</p>`;}
function renderStudio(){const s=selected(),g=state.studio.generated;return intro(`<button class="btn" data-act="studio-export">${I('download','sm')}导出探针说明</button>`)+`<div class="studio-layout"><section class="panel form-panel"><div class="field-group wide"><label class="label" for="studioScenario">源情景</label><select id="studioScenario" class="field" data-change="selected">${sceneOpts()}</select></div><div class="field-group"><label class="label" for="studioFormat">探针形式</label><select id="studioFormat" class="field" data-change="studio-format"><option value="notice" ${state.studio.format==='notice'?'selected':''}>制度通知 / 申请文书</option><option value="service" ${state.studio.format==='service'?'selected':''}>未来服务窗口</option><option value="hearing" ${state.studio.format==='hearing'?'selected':''}>公民听证邀请</option></select></div><div class="field-group"><label class="label" for="studioAudience">参与者</label><select id="studioAudience" class="field" data-change="studio-audience">${['公共服务使用者','青年学习者','地方社区成员','组织与政策制定者','机器治理研究者'].map(a=>`<option ${state.studio.audience===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field-group wide"><label class="label" for="studioConflict">需要显现的价值冲突</label><textarea id="studioConflict" class="field" data-input="studio-conflict" maxlength="180" placeholder="例如：便利与真实退出权">${esc(state.studio.conflict||s.tension)}</textarea></div><div class="notice soft wide" style="margin-bottom:16px;font-size:10px">${I('spark','sm')}<span>使用本地模板把情景转成探针，不调用AI模型，也不会自动证明情景可信。</span></div><button class="btn primary full wide" data-act="generate-studio">${I('spark','sm')}构造思辨探针</button><p class="small-note wide">建议先阅读情景假设，再邀请参与者对文书中的权限与制度提出异议。</p><div class="wide" style="margin-top:17px">${refBtns(['R06','R08',...s.refs])}</div></section><div><div class="paper-stage">${paper(g||buildProbe(s))}</div><div class="protocol"><div class="row between"><h3 style="font-size:13px">把展品变成一次研究遭遇</h3>${badge('建议流程','outline')}</div><p>阅读设定 → 个人选择 → 角色交换 → 提出替代条款 → 共同复盘。涉及真实人类研究时，另行设计知情同意、退出和隐私保护。</p><ol class="question-list"><li>哪一项便利值得接受？代价由谁承担？</li><li>谁没有机会在这份文件上签字、拒绝或申诉？</li><li>改变哪一个条款，能够保留另一种未来？</li></ol></div></div></div>`;}
function buildProbe(s){const formats={notice:{k:'制度文书',heading:'最后一个决定，\n仍然属于谁？',label:'情景授权与复核通知'},service:{k:'服务窗口',heading:'欢迎来到，\n未来的日常。',label:'未来服务办理说明'},hearing:{k:'公众听证',heading:'这个未来，\n需要你的一票。',label:'情景制度听证邀请'}};const f=formats[state.studio.format];return {id:s.id,year:s.year,title:s.artifact||s.title+'·制度探针',heading:f.heading,label:f.label,kind:f.k,audience:state.studio.audience,conflict:state.studio.conflict||s.tension,desc:s.desc,assumptions:s.assumptions,refs:s.refs,created:new Date().toISOString()};}
function paper(g){return `<article class="paper"><div class="paper-top"><span>POST-AI / ${esc(g.year)}<br>FUTURE ARTEFACT ${esc(g.id)}</span><span class="stamp">虚构原型 · 非正式文书</span></div><h2>${esc(g.heading).replaceAll('\n','<br>')}</h2><div class="sub">${esc(g.title)}<br>${esc(g.label)} / 面向${esc(g.audience)}</div><div class="paper-quote">${esc(g.conflict)}</div><p>在这个被暂时设想为日常的世界里：${esc(g.desc)}</p><div style="margin-top:21px"><div class="clause"><b>01</b><div><strong>授权边界</strong><br>请明确：哪些决定可以被委托，哪些选择必须再次征得当事人同意？</div></div><div class="clause"><b>02</b><div><strong>责任与异议</strong><br>请写入：谁承担后果，谁可以复核，以及未被代表的人如何提出异议？</div></div><div class="clause"><b>03</b><div><strong>撤回与修改</strong><br>请补充：如何退出、修改规则，或为不同的生活方式保留空间？</div></div></div><div class="paper-bottom"><span>后AI研究所 · 思辨设计工坊<br>请讨论制度，而不是把它误认为预测。</span><div class="paper-mark">用于讨论<br>并未施行</div></div></article>`;}
function getPath(s){if(!state.paths[s.id]){const years=[s.year,Math.round(2026+(s.year-2026)*.67),Math.round(2026+(s.year-2026)*.33),2027];state.paths[s.id]=[{year:years[0],label:'希望争取的状态',text:`检验「${s.title}」是否真正扩大参与者的选择。`,done:false},{year:years[1],label:'必须成立的条件',text:s.assumptions[0]||'明确必要条件，并建立独立验证。',done:false},{year:years[2],label:'可以撤回的试点',text:'开展小范围试点，比较获益、代价与替代方案。',done:false},{year:years[3],label:'现在可以开始',text:'招募相关参与者，记录基线与分歧，约定退出和停止条件。',done:false}];}return state.paths[s.id];}
function renderPaths(){const s=selected(),path=getPath(s);return intro(selectedOpts())+`<div class="notice soft">${I('route','sm')}<span>以下是从目标返回当下的规划草稿。年份可编辑，不是技术预测；勾选表示完成了工作项，不代表未来情景已实现。</span></div><div class="path-layout"><section><div class="row between" style="margin-bottom:14px"><h2 style="font-size:16px">${esc(s.title)}</h2>${catBadge(s)}</div><div class="timeline">${path.map((t,i)=>`<article class="path-item ${t.done?'completed':''}"><div class="row between"><div class="row"><input type="number" class="field mono" style="width:88px;margin:0;color:var(--mint);font-size:16px;padding:4px 8px" min="2026" max="2200" value="${t.year}" data-input="path-year" data-index="${i}" aria-label="${t.label}的规划年份"><span class="badge outline">${t.label}</span></div><label class="row faint" style="font-size:10px;gap:6px"><input type="checkbox" data-change="path-done" data-index="${i}" ${t.done?'checked':''}>工作项完成</label></div><textarea class="field" data-input="path-text" data-index="${i}" aria-label="${t.label}的行动内容" style="min-height:69px">${esc(t.text)}</textarea></article>`).join('')}</div></section><aside class="stack"><section class="panel"><div class="panel-head"><h2>要观察的，不只是日期</h2></div><div class="panel-body" style="padding-top:0"><div class="signal-card">${badge('当前情景的检验信号','outline')}<p>${esc(s.signal)}</p><label class="label" for="signalState">资料状态（手动记录）</label><select id="signalState" class="field" data-change="signal">${['待搜集证据','已有材料，待复核','存在相反证据','已完成本地讨论'].map(t=>`<option ${(state.signals[s.id]||'待搜集证据')===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="signal-card"><h4>停止或修订的触发条件</h4><p>当假设不能被验证、代价转移给未被代表者，或退出机制失效时，暂停扩展并重审目标。</p></div><div class="signal-card"><h4>不要跳过这条因果链</h4><p>${s.chain.map(esc).join(' → ')}</p></div></div></section><section class="assistant-box" style="margin:0"><h3 class="row">${I('spark','sm')}下一步，不一定是做得更大</h3><p>先把一个宏大目标变成可撤回的试验，再决定是否继续。让验证结果能够改变原来的愿景。</p><button class="link-btn" data-act="method" data-id="M08">查看回溯方法 ${I('arrow','sm')}</button></section><button class="btn full" data-act="export-md">${I('download','sm')}导出当前研究简报</button></aside></div>`;}

function guide(){openModal('从一张图，开始一次未来研究',`<div class="eyebrow">A MAP, NOT A PREDICTION</div><p style="margin-top:12px">未来锥是关于未来判断的可视化分类。它不能代替证据研究，也不是一张概率分布图。</p><ol class="step-list"><li><div><b>点击情景，先看假设。</b><br>横轴是设定年份；时间滑杆改变观察窗口，超过窗口的节点变暗。可编辑情景的分类与画像。</div></li><li><div><b>切换观察者，再看偏好。</b><br>金色虚线环独立于可能性分区。观察者规则仅为演示，不代表真实群体意见。“开放系统”显示研究关注而非价值偏好。</div></li><li><div><b>把多个世界放进同一个问题。</b><br>选择2—4个情景进行比较，进入政策风洞修改判断，或在工坊中制作一份未来制度文书。</div></li><li><div><b>把未来带回当下。</b><br>组合方法、记录反例、编辑回溯路径，再导出Markdown简报或JSON备份。</div></li></ol><div class="notice soft" style="margin:0">本地规则导航和模板生成没有连接大模型；情景画像不是实测分数。该网页不会上传数据或持续监测外部世界。</div><p style="margin-top:14px">快捷键 <span class="help-key">Ctrl / ⌘ + K</span> 搜索，<span class="help-key">Esc</span> 关闭弹窗。方法依据 ${refBtns(['R01','R02'])}</p><div class="dialog-actions"><button class="btn primary" data-act="close">开始探索 ${I('arrow','sm')}</button></div>`);}

function pin(id){if(state.compare.includes(id)){state.compare=state.compare.filter(x=>x!==id);toast('已从比较托盘移除');}else{if(state.compare.length>=4){toast('最多比较4个情景，请先移除一个');return false;}state.compare.push(id);toast('已加入比较托盘');}save();return true;}
function showCompare(){const scenes=compScenes();if(scenes.length<2){toast('请先加入至少两个情景');return;}const rows=[['示例分类',s=>CATS[s.cat].cn+' · '+s.year],['社会设定',s=>s.desc],['核心张力',s=>s.tension],['关键条件',s=>s.assumptions.join('；')],['观察信号',s=>s.signal],['证据状态',s=>s.evidence+'（非预测）']];openModal('比较未来，不急于选择一个答案',`<div class="notice soft">情景不是彼此排斥的完整世界，也不具有已分配的概率。比较旨在揭示差异和可共存的制度安排。</div><div class="table-scroll"><table class="data-table"><thead><tr><th>比较维度</th>${scenes.map(s=>`<th style="min-width:190px"><span class="scene-id">${esc(s.id)}</span><br>${esc(s.title)}</th>`).join('')}</tr></thead><tbody>${rows.map(([label,fn])=>`<tr><td>${label}</td>${scenes.map(s=>`<td style="vertical-align:top;line-height:1.9;color:#b6cbd5">${esc(fn(s))}</td>`).join('')}</tr>`).join('')}<tr><td>独立偏好叠层</td>${scenes.map(s=>`<td>${OBS[state.observer].test(s)?'<span class="mint">● 符合当前示例规则</span>':'<span class="faint">○ 不符合当前示例规则</span>'}</td>`).join('')}</tr></tbody></table></div><p class="small-note" style="margin-top:15px">${esc(OBS[state.observer].description)} 这不是真实利益相关者的意见调查。</p><div class="dialog-actions"><button class="btn" data-act="export-md">${I('download','sm')}导出简报</button><button class="btn primary" data-view="wind">放入政策风洞 ${I('arrow','sm')}</button></div>`,true);}
function editScene(id){const existing=id?state.scenarios.find(s=>s.id===id):null;const s=existing||{title:'',year:2046,cat:'possible',desc:'',tension:'',assumptions:['',''],metrics:{tech:60,access:60,agency:60,openness:40},signal:'',artifact:'',note:''};openModal(existing?'编辑情景 · '+s.id:'新建一个替代未来',`<form id="sceneForm"><div class="modal-grid"><div class="field-group"><label class="label" for="sTitle">情景名称</label><input class="field" id="sTitle" name="title" value="${esc(s.title)}" maxlength="18" required placeholder="例如：可退出的代理社会"></div><div class="field-group"><label class="label" for="sYear">设定年份（不是预测）</label><input class="field mono" id="sYear" name="year" type="number" min="2030" max="2060" value="${s.year}" required></div><div class="field-group"><label class="label" for="sCat">工作坊分类判断</label><select class="field" id="sCat" name="cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k===s.cat?'selected':''}>${c.cn} / ${c.en}</option>`).join('')}</select></div><div class="field-group"><label class="label" for="sTension">核心价值冲突</label><input class="field" id="sTension" name="tension" value="${esc(s.tension)}" maxlength="90" required placeholder="便利 × 实际控制"></div></div><div class="field-group"><label class="label" for="sDesc">世界设定</label><textarea class="field" id="sDesc" name="desc" maxlength="700" required>${esc(s.desc)}</textarea></div><div class="modal-grid"><div class="field-group"><label class="label" for="sA1">必要条件一</label><input class="field" id="sA1" name="a1" value="${esc(s.assumptions[0]||'')}" maxlength="150" required></div><div class="field-group"><label class="label" for="sA2">必要条件二</label><input class="field" id="sA2" name="a2" value="${esc(s.assumptions[1]||'')}" maxlength="150" required></div></div><h4 style="margin-bottom:5px">情景画像</h4><p class="small-note" style="margin-bottom:14px">0—100仅表达你如何刻画这个世界，不是置信度、实测能力或经过验证的量表。</p><div class="modal-grid">${Object.entries(metricNames).map(([k,n])=>`<div class="field-group"><label class="label row between" for="m-${k}"><span>${n}</span><output id="out-${k}" class="mono mint">${s.metrics[k]}</output></label><input type="range" id="m-${k}" name="${k}" data-input="metric-preview" data-key="${k}" min="0" max="100" value="${s.metrics[k]}"></div>`).join('')}</div><div class="field-group"><label class="label" for="sSignal">什么证据会改变你的判断？</label><textarea class="field" id="sSignal" name="signal" maxlength="450" required>${esc(s.signal)}</textarea></div><div class="field-group"><label class="label" for="sNote">分类依据与修改说明</label><input class="field" id="sNote" name="note" value="${esc(s.note||'')}" maxlength="350" placeholder="保留你自己的理由与不确定性"></div><div class="dialog-actions">${existing?`<button type="button" class="btn danger ghost" data-act="delete-scene" data-id="${esc(id)}">删除情景</button>`:''}<span class="grow"></span><button type="button" class="btn" data-act="close">取消</button><button type="submit" class="btn primary" data-edit-id="${esc(id||'')}">保存情景</button></div></form>`,true);$('#sceneForm').addEventListener('submit',e=>{e.preventDefault();if(!e.target.reportValidity())return;const f=new FormData(e.target);let title=String(f.get('title')).trim();if(!title){toast('请填写情景名称');return;}if(!existing&&state.scenarios.length>=20){toast('此原型最多容纳20个情景，请先删除一个');return;}const n={id:existing?.id||'S'+String(Math.max(8,...state.scenarios.map(x=>Number(x.id.slice(1))||0))+1).padStart(2,'0'),title,year:Number(f.get('year')),cat:f.get('cat'),band:existing?.band||(state.scenarios.length%2?-.65:.65),desc:String(f.get('desc')).trim(),tension:String(f.get('tension')).trim(),assumptions:[String(f.get('a1')).trim(),String(f.get('a2')).trim()],metrics:Object.fromEntries(Object.keys(metricNames).map(k=>[k,Number(f.get(k))])),signal:String(f.get('signal')).trim(),note:String(f.get('note')).trim(),artifact:existing?.artifact||title+' · 制度文书',refs:existing?.refs||['P01'],chain:existing?.chain||['验证关键条件','组织和行为发生改变','形成新的制度安排'],evidence:existing?.evidence||'自定义假设'};if(existing)state.scenarios=state.scenarios.map(x=>x.id===n.id?n:x);else state.scenarios.push(n);state.selected=n.id;state.studio.generated=null;log((existing?'修订':'新增')+'情景：'+n.title+(n.note?'；'+n.note:''));closeModal();render();toast('情景已保存；分类与画像仍是工作判断');});}
function scoreModal(pid,sid){const p=DATA.policies.find(p=>p.id===pid),s=state.scenarios.find(s=>s.id===sid);if(!p||!s)return;const key=pid+'|'+sid,e=evalScore(p,s),reason=state.assess[key]?.reason||p.reason;openModal('记录判断 · '+p.short,`<div class="row wrap">${badge(s.title,'outline')}${badge(s.id,'outline')}</div><p style="margin-top:13px">${esc(p.desc)}</p><div class="sep"></div><label class="label" for="scoreValue">基线评分（先不计入额外冲击）</label><select id="scoreValue" class="field">${[[-2,'明显冲突'],[-1,'存在代价'],[0,'待判断 / 不适用'],[1,'有条件支持'],[2,'较强支持']].map(([n,t])=>`<option value="${n}" ${e.base===n?'selected':''}>${n>0?'+':''}${n} · ${t}</option>`).join('')}</select><label class="label" style="margin-top:17px" for="scoreReason">理由、必要条件与相反证据</label><textarea id="scoreReason" class="field" maxlength="1500" style="min-height:125px">${esc(reason)}</textarea><div class="notice soft" style="margin:16px 0 0"><span>当前冲击规则：${esc(e.reason)}<br>显示分数 = 基线 + 调整，限制在 −2 到 +2。当前显示 ${e.score>0?'+':''}${e.score}。</span></div><p class="small-note">这是分析者的显式判断，不是模型估计。</p><div class="dialog-actions"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="save-score" data-p="${pid}" data-s="${esc(sid)}">保存判断</button></div>`);}

function searchResults(q){const text=q.trim().toLowerCase();const items=[...state.scenarios.map(s=>({kind:'情景',title:s.title,sub:s.id+' · '+s.year,act:'scene-search',id:s.id,body:JSON.stringify(s)})),...DATA.methods.map(m=>({kind:'方法',title:m.title,sub:m.en,act:'method',id:m.id,body:JSON.stringify(m)})),...DATA.refs.map(r=>({kind:'资料',title:r.title,sub:r.author,act:'source',id:r.id,body:JSON.stringify(r)}))].filter(x=>!text||x.body.toLowerCase().includes(text)).slice(0,20);$('#searchResults').innerHTML=items.map(x=>`<button class="search-result" data-act="${x.act}" data-id="${esc(x.id)}">${I(x.kind==='情景'?'cone':x.kind==='方法'?'grid':'book')}<span class="grow">${esc(x.title)}<small>${esc(x.sub)}</small></span>${badge(x.kind,'outline')}${I('arrow','sm')}</button>`).join('')||'<div class="empty">没有找到匹配内容。试试“未来”“能力”或“回溯”。</div>';}
function exportModal(){openModal('带走你的研究',`<p>Markdown简报包含所选情景、方法链、政策判断、回溯路径、分歧与资料来源。JSON备份包含全部本地状态，可重新导入本工作台。</p><div class="rule-card"><h3>研究简报 · Markdown</h3><p>适合读书会、工作坊、进一步编辑与分享。</p><button class="btn primary" style="margin-top:12px" data-act="export-md">${I('download','sm')}导出 .md</button></div><div class="rule-card"><h3>完整工作区 · JSON</h3><p>保留自定义情景、编辑过的分值与笔记。</p><div class="row" style="margin-top:12px"><button class="btn" data-act="export-json">导出备份</button><button class="btn ghost" data-act="import">导入备份</button></div></div><p class="small-note" style="margin-top:15px">文件由你的浏览器在本地生成。没有上传、账户登录或模型调用。</p>`);}
function dl(text,filename,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function mdBrief(){const ss=compScenes().length?compScenes():[selected()];const date=new Date().toISOString().slice(0,10),s=selected();let t=`# 后AI研究所 · 未来研究简报\n\n导出日期：${date}\n\n> 交互工作台研究记录。情景年份、分类、画像与默认评分为演示判断，不是概率预测、实际政策效果或已经实施的制度。\n\n## 1. 观察位置\n\n观察窗口：2026—${state.year}\n当前视角：${OBS[state.observer].name}\n${OBS[state.observer].description}\n\n## 2. 比较情景\n\n`;
ss.forEach(x=>{t+=`### ${x.id} ${x.title}（${x.year}）\n\n分类：${CATS[x.cat].cn}（工作判断）\n状态：${x.evidence}\n\n${x.desc}\n\n核心张力：${x.tension}\n\n必要条件：\n${x.assumptions.map(a=>'- '+a).join('\n')}\n\n因果链：${x.chain.join(' → ')}\n\n观察信号：${x.signal}\n\n情景画像（0—100作者刻画，非实测）：${Object.entries(metricNames).map(([k,n])=>`${n} ${x.metrics[k]}`).join('；')}\n\n修改说明：${x.note||'未另外记录'}\n来源线索：${x.refs.join('、')}\n\n`;});
t+='## 3. 方法链\n\n';state.toolkit.forEach((id,i)=>{const m=DATA.methods.find(m=>m.id===id);t+=`${i+1}. **${m.title}**：${m.question}\n   建议：${m.steps.join(' → ')}\n   边界：${m.boundary}\n\n`;});
t+='## 4. 政策压力测试\n\n冲击设定：'+({none:'无额外冲击',energy:'能源与算力紧缩',outage:'持续服务中断'}[state.shock])+'\n\n> 以下是本地工作坊判断；分值从 −2（明显冲突）到 +2（较强支持），0 表示待判断或不适用。不可将其解释成真实效果。\n\n';
const ps=DATA.policies.filter(p=>state.policies.includes(p.id));ps.forEach(p=>{t+=`### ${p.id} ${p.title}\n\n`;ss.forEach(x=>{const e=evalScore(p,x);t+=`- ${x.id} ${x.title}：${e.score>0?'+':''}${e.score}（基线 ${e.base}，规则调整 ${e.delta}，截断于[-2,2]）\n  理由：${state.assess[p.id+'|'+x.id]?.reason||p.reason}\n  冲击：${e.reason}\n`;});t+='\n';});
t+=`## 5. 当前情景的回溯路径：${s.title}\n\n> 规划节点不是技术预测。勾选指本地工作项完成，不表示未来已经发生。\n\n`;getPath(s).forEach(p=>{t+=`- [${p.done?'x':' '}] ${p.year} · ${p.label}：${p.text}\n`;});t+=`\n资料状态：${state.signals[s.id]||'待搜集证据'}\n\n## 6. 分歧与反例\n\n${state.notes||'尚未记录。'}\n\n## 7. 规则导航\n\n`;insights(s).forEach(r=>{t+=`### ${r.title}\n\n${r.body}\n\n触发规则：${r.rule}\n\n`;});t+='## 8. 资料来源\n\n';DATA.refs.forEach(r=>{t+=`- **${r.id} ${r.title}** — ${r.author}，${r.date}\n  ${r.url||'本对话／项目附带材料（本文件不含原始全文）'}\n  使用边界：${r.note}\n\n`;});if(state.studio.generated){const g=state.studio.generated;t+=`## 9. 已构造的思辨探针\n\n${g.title}（${g.year}，源情景 ${g.id}）\n\n> 虚构原型，不是正式文书。\n\n${g.heading}\n\n参与者：${g.audience}\n核心冲突：${g.conflict}\n\n请填写授权边界、责任与异议，以及撤回与修改机制。\n\n`;}t+='---\nPost-AI Institute · 本地研究原型 v1.0\n';return t;}
function exportJSON(){dl(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'PostAI_Futures_Workspace.json','application/json;charset=utf-8');toast('JSON备份已生成');}
function exportMD(){dl(mdBrief(),'PostAI_Futures_Research_Brief.md','text/markdown;charset=utf-8');toast('Markdown研究简报已生成');}
function exportProbe(){const g=state.studio.generated||buildProbe(selected());const t=`# ${g.title}\n\n> 思辨设计虚构原型，不是正式文书或未来预测。由本地模板构造。\n\n源情景：${g.id}；设定年份：${g.year}\n形式：${g.kind}\n参与者：${g.audience}\n\n## 设定\n\n${g.desc}\n\n核心张力：${g.conflict}\n\n必要条件：\n${g.assumptions.map(a=>'- '+a).join('\n')}\n\n## 原型文本\n\n${g.heading}\n\n1. 授权边界：哪些决定可以被委托，哪些选择必须再次征得当事人同意？\n2. 责任与异议：谁承担后果，谁可以复核，未被代表的人如何提出异议？\n3. 撤回与修改：如何退出、修改规则，或为不同生活方式保留空间？\n\n## 排演建议\n\n阅读设定 → 个人选择 → 角色交换 → 提出替代条款 → 共同复盘。\n\n## 研究问题\n\n- 哪一项便利值得接受？代价由谁承担？\n- 谁无法签字、拒绝或申诉？\n- 哪个条款能为另一种未来保留空间？\n\n> 涉及真实参与者时，另行设计知情同意、退出机制和隐私保护。排演中的反应不能直接预测真实社会行为。\n\n## 来源线索\n\n${['R06','R08',...g.refs].map(id=>{const r=ref(id);return `${id} ${r.title} — ${r.url||'项目附带材料'}`;}).join('\n\n')}\n\n后AI研究所 · Post-AI Institute\n`;dl(t,'PostAI_Speculative_Probe.md','text/markdown;charset=utf-8');toast('思辨探针说明已生成');}
function cleanImport(o){if(!o||o.version!==1||!Array.isArray(o.scenarios)||o.scenarios.length<1||o.scenarios.length>20)throw new Error('不是支持的工作区备份，或情景数量不在1—20之间。');const st=(x,n=1500)=>typeof x==='string'?x.slice(0,n):'';const num=(x,min,max)=>{const v=Number(x);if(!Number.isFinite(v)||v<min||v>max)throw new Error('备份包含超出范围的数值。');return v;};const ids=new Set();const scenes=o.scenarios.map(s=>{if(!s||!/^S[A-Za-z0-9_-]{1,18}$/.test(s.id)||ids.has(s.id)||!CATS[s.cat])throw new Error('情景编号或分类无效。');ids.add(s.id);const title=st(s.title,18).trim();if(!title)throw new Error('情景名称不能为空。');return {id:s.id,title,year:Math.round(num(s.year,2030,2060)),cat:s.cat,band:num(s.band??.5,-1,1),desc:st(s.desc,1500),tension:st(s.tension,180),assumptions:(Array.isArray(s.assumptions)?s.assumptions:['待补充条件']).slice(0,4).map(x=>st(x,250)),metrics:Object.fromEntries(Object.keys(metricNames).map(k=>[k,num(s.metrics?.[k]??50,0,100)])),signal:st(s.signal,700),artifact:st(s.artifact,160)||title+' · 制度文书',note:st(s.note,1000),chain:(Array.isArray(s.chain)?s.chain:['待验证']).slice(0,6).map(x=>st(x,120)),refs:(Array.isArray(s.refs)?s.refs:['P01']).filter(id=>DATA.refs.some(r=>r.id===id)),evidence:['情景假设','自定义假设'].includes(s.evidence)?s.evidence:'自定义假设'};});const validArr=(a,valid,max=100)=>[...new Set((Array.isArray(a)?a:[]).filter(x=>valid.includes(x)))].slice(0,max);const n={version:1,scenarios:scenes,selected:ids.has(o.selected)?o.selected:scenes[0].id,compare:validArr(o.compare,[...ids],4),year:Math.round(num(o.year??2060,2030,2060)),observer:OBS[o.observer]?o.observer:'public',overlay:o.overlay!==false,chart:o.chart==='matrix'?'matrix':'cone',hidden:validArr(o.hidden,Object.keys(CATS)),toolkit:validArr(o.toolkit,DATA.methods.map(m=>m.id)),policies:validArr(o.policies,DATA.policies.map(p=>p.id)),assess:{},shock:['none','energy','outage'].includes(o.shock)?o.shock:'none',paths:{},signals:{},notes:st(o.notes,20000),studio:{format:['notice','service','hearing'].includes(o.studio?.format)?o.studio.format:'notice',audience:['公共服务使用者','青年学习者','地方社区成员','组织与政策制定者','机器治理研究者'].includes(o.studio?.audience)?o.studio.audience:'公共服务使用者',conflict:st(o.studio?.conflict,180),generated:null},journal:[]};
for(const p of DATA.policies)for(const s of scenes){const a=o.assess?.[p.id+'|'+s.id];if(a)n.assess[p.id+'|'+s.id]={score:Math.round(num(a.score,-2,2)),reason:st(a.reason,1500)};}
for(const s of scenes){const p=o.paths?.[s.id];if(Array.isArray(p)&&p.length===4)n.paths[s.id]=p.map((t,i)=>({year:Math.round(num(t.year,2026,2200)),label:['希望争取的状态','必须成立的条件','可以撤回的试点','现在可以开始'][i],text:st(t.text,2000),done:t.done===true}));if(['待搜集证据','已有材料，待复核','存在相反证据','已完成本地讨论'].includes(o.signals?.[s.id]))n.signals[s.id]=o.signals[s.id];}
if(o.studio?.generated&&ids.has(o.studio.generated.id)){const g=o.studio.generated;n.studio.generated={id:g.id,year:Math.round(num(g.year,2030,2060)),title:st(g.title,160),heading:st(g.heading,160),label:st(g.label,160),kind:st(g.kind,40),audience:st(g.audience,80),conflict:st(g.conflict,180),desc:st(g.desc,1500),assumptions:(Array.isArray(g.assumptions)?g.assumptions:[]).slice(0,4).map(x=>st(x,250)),refs:validArr(g.refs,DATA.refs.map(r=>r.id)),created:st(g.created,50)};}
if(Array.isArray(o.journal))n.journal=o.journal.slice(0,80).map(j=>({at:st(j.at,50),text:st(j.text,500)}));return n;}
function doReset(){openModal('重置本地研究空间',`<p>这会移除此工作台中的自定义情景、评分、笔记与方法组合，恢复内置示例。不会影响浏览器中的其他网站数据。建议先导出JSON备份。</p><div class="dialog-actions"><button class="btn" data-act="export-json">先备份</button><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="reset-confirm">确认重置</button></div>`);}
function journal(){openModal('本地修改记录',`<p>记录情景、政策评分和备份导入等关键修改；文本笔记实时保存，不逐字生成日志。</p><div class="stack" style="margin-top:18px">${state.journal.map(j=>`<div class="rule-card" style="margin:0"><small class="faint mono">${esc(j.at.replace('T',' ').slice(0,19))}</small><p>${esc(j.text)}</p></div>`).join('')||'<div class="empty">还没有关键修改记录。编辑情景或政策判断后会显示在这里。</div>'}</div>`);}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){closeModal();navigate(v.dataset.view);return;}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
if(a==='close'){closeModal();return;}
if(a==='menu'){$('#sidebar').classList.add('open');$('#scrim').classList.add('open');return;}
if(a==='menu-close'){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');return;}
if(a==='scene'||a==='scene-search'){state.selected=id;state.studio.generated=null;state.studio.conflict='';save();if(a==='scene-search'){closeModal();navigate('explore');}else{stopPlay();render();}return;}
if(a==='cat-toggle'){const k=el.dataset.cat;state.hidden=state.hidden.includes(k)?state.hidden.filter(x=>x!==k):[...state.hidden,k];stopPlay();render();return;}
if(a==='chart'){state.chart=el.dataset.mode;stopPlay();render();return;}
if(a==='overlay'){state.overlay=!state.overlay;stopPlay();render();return;}
if(a==='play'){play();return;}
if(a==='pin'){pin(id);render();return;}
if(a==='compare'){showCompare();return;}
if(a==='guide'){guide();return;}
if(a==='insights'){showInsights();return;}
if(a==='method'){showMethod(id);return;}
if(a==='source'){showSource(id);return;}
if(a==='method-filter'){methodFilter=el.dataset.filter;render();return;}
if(a==='source-filter'){sourceFilter=el.dataset.filter;render();return;}
if(a==='toolkit'){const was=state.toolkit.includes(id);state.toolkit=was?state.toolkit.filter(x=>x!==id):[...state.toolkit,id];save();render();if($('#modal').open)showMethod(id);toast(was?'已从方法链移除':'已加入研究方法链');return;}
if(a==='add'){editScene();return;}
if(a==='edit'){editScene(id||state.selected);return;}
if(a==='delete-scene'){if(state.scenarios.length<2){toast('至少保留一个情景');return;}const s=state.scenarios.find(x=>x.id===id);openModal('删除情景',`<p>确认删除「${esc(s.title)}」？相关本地评分与路径不再参与当前研究。</p><div class="dialog-actions"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="delete-confirm" data-id="${esc(id)}">确认删除</button></div>`);return;}
if(a==='delete-confirm'){const s=state.scenarios.find(x=>x.id===id);state.scenarios=state.scenarios.filter(x=>x.id!==id);state.compare=state.compare.filter(x=>x!==id);if(state.selected===id)state.selected=state.scenarios[0].id;state.studio.generated=null;delete state.paths[id];delete state.signals[id];for(const key of Object.keys(state.assess))if(key.endsWith('|'+id))delete state.assess[key];log('删除情景：'+s.title);closeModal();render();toast('情景已删除');return;}
if(a==='score'){scoreModal(el.dataset.p,el.dataset.s);return;}
if(a==='save-score'){const reason=$('#scoreReason').value.trim();if(!reason){toast('请保留评分理由，即使目前只能写“待验证”');$('#scoreReason').focus();return;}state.assess[el.dataset.p+'|'+el.dataset.s]={score:Number($('#scoreValue').value),reason};log('修订政策判断：'+el.dataset.p+' × '+el.dataset.s+'；基线 '+$('#scoreValue').value);closeModal();render();toast('评分与理由已保存');return;}
if(a==='run-wind'){if(compScenes().length<2||!state.policies.length){toast('请至少选择两个情景和一项政策');return;}openModal('压力测试摘要',`<p>基于 ${compScenes().length} 个情景、${state.policies.length} 项政策，以及当前的冲击设定。</p>${windSummary()}<div class="dialog-actions"><button class="btn" data-act="export-md">导出完整判断</button><button class="btn primary" data-act="close">继续检查</button></div>`,true);return;}
if(a==='generate-studio'){state.studio.generated=buildProbe(selected());save();render();toast('思辨探针已构造 · 基于本地模板');return;}
if(a==='studio-export'){exportProbe();return;}
if(a==='search'){searchModal();return;}
if(a==='export'){exportModal();return;}
if(a==='export-md'){exportMD();return;}
if(a==='export-json'){exportJSON();return;}
if(a==='import'){$('#importFile').value='';$('#importFile').click();return;}
if(a==='reset'){doReset();return;}
if(a==='reset-confirm'){try{localStorage.removeItem(KEY);}catch(e){}location.hash='explore';location.reload();return;}
if(a==='journal'){journal();return;}
});
document.addEventListener('change',e=>{const el=e.target,key=el.dataset.change;if(!key)return;
if(key==='observer'){state.observer=el.value;stopPlay();render();return;}
if(key==='selected'){state.selected=el.value;state.studio.generated=null;state.studio.conflict='';render();return;}
if(key==='compare'){const ok=pin(el.value);if(ok===false)el.checked=false;render();return;}
if(key==='policy'){state.policies=el.checked?[...new Set([...state.policies,el.value])]:state.policies.filter(x=>x!==el.value);render();return;}
if(key==='shock'){state.shock=el.value;render();return;}
if(key==='studio-format'){state.studio.format=el.value;state.studio.generated=null;save();render();return;}
if(key==='studio-audience'){state.studio.audience=el.value;state.studio.generated=null;save();render();return;}
if(key==='path-done'){getPath(selected())[Number(el.dataset.index)].done=el.checked;save();el.closest('.path-item').classList.toggle('completed',el.checked);return;}
if(key==='signal'){state.signals[state.selected]=el.value;save();toast('已更新本地资料状态');return;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='timeSlider'){stopPlay();updateYear(el.value);return;}if(el.id==='searchBox'){searchResults(el.value);return;}const k=el.dataset.input;if(!k)return;
if(k==='metric-preview'){$('#out-'+el.dataset.key).textContent=el.value;return;}
if(k==='notes'){state.notes=el.value;save();return;}
if(k==='studio-conflict'){state.studio.conflict=el.value;state.studio.generated=null;save();return;}
if(k==='path-text'){getPath(selected())[Number(el.dataset.index)].text=el.value;save();return;}
if(k==='path-year'){const n=Number(el.value);if(Number.isInteger(n)&&n>=2026&&n<=2200){getPath(selected())[Number(el.dataset.index)].year=n;save();}return;}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();return;}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');stopPlay();}const node=e.target.closest?.('g.node');if(node&&['Enter',' '].includes(e.key)){e.preventDefault();node.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{if(previousFocus?.isConnected)previousFocus.focus();});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>2*1024*1024){toast('备份文件过大，请选择2MB以内的JSON');return;}try{const candidate=cleanImport(JSON.parse(await f.text()));openModal('导入工作区备份',`<p>备份包含 ${candidate.scenarios.length} 个情景、${Object.keys(candidate.assess).length} 项自定义政策判断。导入会替换当前本地研究状态。</p><div class="dialog-actions"><button class="btn" data-act="export-json">先备份当前内容</button><button class="btn" data-act="close">取消</button><button class="btn primary" id="confirmImport">确认导入</button></div>`);$('#confirmImport').addEventListener('click',()=>{state=candidate;log('从JSON备份导入研究工作区');closeModal();render();toast('研究工作区已恢复');});}catch(err){openModal('没有导入这个文件',`<p>文件无法作为当前版本工作区读取。原有内容未被修改。</p><p class="small-note">${esc(err.message)}</p><div class="dialog-actions"><button class="btn" data-act="close">返回</button></div>`);}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(META[h]&&h!==view)navigate(h);});
// Validate restored state as strictly as an imported backup. No dynamic code execution.
try{state=cleanImport(state);}catch(e){try{localStorage.removeItem(KEY);}catch{}state=cleanImport({version:1,scenarios:DATA.scenarios,selected:'S02',compare:['S01','S02','S03','S06'],year:2060,observer:'public',overlay:true,toolkit:['M01','M04','M06','M07'],policies:['P1','P2','P4','P6']});}
render();
